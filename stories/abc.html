<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC with Maya &amp; Moti</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Baloo 2','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
    background:#7ec8f7; color:#1d1d2f; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  #topbar { display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; z-index:30; }
  #homeBtn { width:44px; height:44px; border:none; border-radius:14px; background:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,.15); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #homeBtn:active { transform:translateY(2px); box-shadow:none; }
  #dots { display:flex; gap:10px; }
  .dot { width:44px; height:44px; border-radius:50%; background:#ffffffaa; display:flex;
    align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#999;
    border:3px solid transparent; transition:all .3s; }
  .dot.done { background:#ffd166; color:#1d1d2f; border-color:#fff; }
  .dot.now { background:#fff; color:#1d1d2f; border-color:#ff5964; transform:scale(1.12); }

  /* ---------- stage ---------- */
  #stage { position:relative; flex:1; overflow:hidden; border-radius:24px; margin:0 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.18); background:#aee3f5; }
  .plane { position:absolute; inset:0; pointer-events:none; will-change:transform; }
  .plane img { position:absolute; }
  #farImg { width:100%; height:100%; object-fit:cover; }
  #midImg { bottom:6%; left:-12%; width:124%; }
  #nearImg { bottom:-2%; left:-12%; width:124%; }
  #objWrap { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    width:min(46vw,220px); z-index:5; }
  #objWrap img { width:100%; display:block; filter:drop-shadow(0 10px 12px rgba(0,0,0,.25)); }
  .floaty { animation:floaty 3.2s ease-in-out infinite; }
  @keyframes floaty { 0%,100%{transform:translate(-50%,-50%) translateY(0)} 50%{transform:translate(-50%,-50%) translateY(-12px)} }
  #maya { position:absolute; left:3%; bottom:2%; width:min(24vw,130px); z-index:6; }
  #maya img { width:100%; display:block; }
  #moti { position:absolute; right:4%; bottom:3%; width:min(26vw,140px); z-index:6; }
  #moti img { width:100%; display:block; }
  .cheer { animation:cheer .6s ease; }
  @keyframes cheer { 0%{transform:scale(1)} 35%{transform:scale(1.18) rotate(-4deg)} 70%{transform:scale(1.1) rotate(3deg)} 100%{transform:scale(1)} }
  #letterBadge { position:absolute; top:10px; left:12px; z-index:7; width:76px; height:76px;
    background:#fff; border-radius:22px; display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.15); border:4px solid #ff5964; }

  /* ---------- quiz ---------- */
  #quizLayer { position:absolute; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; gap:14px; padding:20px;
    background:rgba(255,255,255,.35); backdrop-filter:blur(2px); }
  #quizLayer.on { display:flex; }
  .qcard { width:min(28vw,170px); aspect-ratio:1; background:#fff; border-radius:24px;
    border:5px solid transparent; box-shadow:0 6px 0 rgba(0,0,0,.12); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:10px;
    transition:transform .15s; }
  .qcard img { max-width:100%; max-height:100%; pointer-events:none; }
  .qcard:active { transform:scale(.93); }
  .qcard.right { border-color:#2ec4b6; animation:cheer .6s ease; background:#e8fffb; }
  .qcard.wiggle { animation:wiggle .45s ease; }
  @keyframes wiggle { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px) rotate(-3deg)} 75%{transform:translateX(10px) rotate(3deg)} }

  /* ---------- trace ---------- */
  #traceLayer { position:absolute; inset:0; z-index:10; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(255,255,255,.55); }
  #traceLayer.on { display:flex; }
  #traceBox { position:relative; width:min(64vw,330px); aspect-ratio:1; touch-action:none; }
  #traceBox img { position:absolute; inset:0; width:100%; height:100%; }
  #traceCanvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #traceProg { width:min(64vw,330px); height:18px; background:#ffffffaa; border-radius:10px;
    margin-top:14px; overflow:hidden; border:3px solid #fff; }
  #traceFill { height:100%; width:0%; border-radius:8px;
    background:linear-gradient(90deg,#ffd166,#ff9f1c); transition:width .2s; }

  /* ---------- prompt + caption ---------- */
  #prompt { text-align:center; font-size:clamp(20px,4.6vw,30px); font-weight:800; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.25); padding:8px 16px 2px; min-height:1.6em; z-index:20; }
  #capbar { margin:4px 12px 10px; background:rgba(20,20,40,.82); border-radius:20px;
    padding:12px 16px; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #captext { color:#fff; font-size:clamp(19px,4.4vw,27px); line-height:1.65; font-weight:600; text-align:center; }
  #captext .w { border-radius:10px; padding:1px 5px; transition:background .12s; }
  #captext .w.spoken { background:#ffd166; color:#1d1d2f; }
  #captext.tappable .w { cursor:pointer; background:#ffffff22; }
  #captext.tappable .w:active { background:#ffd166; color:#1d1d2f; }

  /* ---------- next button ---------- */
  #nextBtn { position:absolute; right:18px; bottom:118px; z-index:25; width:72px; height:72px;
    border:none; border-radius:50%; background:#ff5964; box-shadow:0 5px 0 #c23340;
    cursor:pointer; display:none; align-items:center; justify-content:center; }
  #nextBtn.on { display:flex; }
  #nextBtn:active { transform:translateY(3px); box-shadow:none; }

  /* ---------- start / finale overlays ---------- */
  .overlay { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;
    background:linear-gradient(160deg,#7ec8f7,#b8e6a0); }
  .overlay h1 { font-size:clamp(34px,9vw,58px); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.2); line-height:1.15; }
  .overlay p { font-size:clamp(18px,4.5vw,24px); color:#1d1d2f; font-weight:700; max-width:420px; }
  .bigbtn { border:none; border-radius:999px; background:#ff5964; color:#fff;
    font-family:inherit; font-size:clamp(24px,6vw,32px); font-weight:800;
    padding:16px 58px; cursor:pointer; box-shadow:0 6px 0 #c23340; }
  .bigbtn:active { transform:translateY(4px); box-shadow:none; }
  #startChars { display:flex; align-items:flex-end; gap:8px; }
  #startChars img { display:block; }
  .hidden { display:none !important; }

  /* ---------- star burst ---------- */
  .star { position:absolute; z-index:40; pointer-events:none; animation:starpop 1s ease forwards; }
  @keyframes starpop {
    0% { transform:scale(0) rotate(0); opacity:1; }
    60% { transform:scale(1.25) rotate(20deg); opacity:1; }
    100% { transform:scale(.9) rotate(-10deg) translateY(-40px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .floaty, .cheer { animation:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="homeBtn" aria-label="Home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1d1d2f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <div id="dots">
      <div class="dot" data-l="a">A</div><div class="dot" data-l="b">B</div><div class="dot" data-l="c">C</div>
    </div>
    <div style="width:44px"></div>
  </div>

  <div id="stage">
    <div class="plane" id="planeFar"><img id="farImg" alt=""></div>
    <div class="plane" id="planeMid"><img id="midImg" alt=""></div>
    <div class="plane" id="planeNear"><img id="nearImg" alt=""></div>
    <div id="objWrap" class="floaty"><img id="objImg" alt=""></div>
    <div id="letterBadge">A</div>
    <div id="maya"><img src="img/abc/abc-maya.png" alt="Maya"></div>
    <div id="moti"><img src="img/abc/abc-moti.png" alt="Moti"></div>

    <div id="quizLayer"></div>
    <div id="traceLayer">
      <div id="traceBox"><img id="traceLetter" alt=""><canvas id="traceCanvas"></canvas></div>
      <div id="traceProg"><div id="traceFill"></div></div>
    </div>
    <button id="nextBtn" aria-label="Next">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
  </div>

  <div id="prompt"></div>
  <div id="capbar"><div id="captext"></div></div>

  <div class="overlay" id="startOverlay">
    <div id="startChars">
      <img src="img/abc/abc-maya.png" style="width:min(30vw,140px)" alt="Maya">
      <img src="img/abc/abc-moti.png" style="width:min(34vw,160px)" alt="Moti">
    </div>
    <h1>ABC with<br>Maya &amp; Moti</h1>
    <p>Watch, tap, and trace your way through A, B, and C!</p>
    <button class="bigbtn" id="startBtn">Start</button>
  </div>

  <div class="overlay hidden" id="finaleOverlay" style="background:linear-gradient(160deg,#ffd166,#ff9f1c)">
    <img src="img/abc/abc-moti.png" style="width:min(44vw,200px)" alt="Moti">
    <h1>You did it!</h1>
    <p>You read A, B, and C all by yourself. Maya and Moti are so proud!</p>
    <button class="bigbtn" id="againBtn">Play Again</button>
  </div>
</div>

<script>
'use strict';
const LETTERS = ['a','b','c'];
const COLORS = { a:'#e63946', b:'#3a86ff', c:'#fb8500' };
let DATA = null;
let li = 0;                 // letter index
let phase = 'watch';        // watch | read | quiz | trace
let audio = new Audio();
let wordRAF = 0;
/* play exactly one word: stop on the animation frame the word ends, not on a
   coarse timer tick (which could overshoot ~250ms into the next word) */
function playWord(i) {
  const w = words[i];
  cancelAnimationFrame(wordRAF);
  audio.currentTime = Math.max(0, w.s - 0.03);
  audio.play().catch(()=>{});
  sfx.pop();
  const endAt = w.e, deadline = performance.now() + 4000;
  const tick = () => {
    if (audio.ended) return;
    if (!audio.paused && audio.currentTime >= endAt) { audio.pause(); return; }
    if (performance.now() > deadline) { audio.pause(); return; }
    wordRAF = requestAnimationFrame(tick);
  };
  wordRAF = requestAnimationFrame(tick);
}
let words = [];
let painted = null, letterCells = 0, paintedCount = 0, tracing = false;
let actx = null;

const $ = id => document.getElementById(id);
const stage=$('stage'), promptEl=$('prompt'), captext=$('captext'), capbar=$('capbar');

/* ---------- tiny synth sfx ---------- */
function tone(f, t0, dur, type='sine', vol=.18) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, actx.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + .05);
}
const sfx = {
  chime(){ tone(523,.0,.25); tone(659,.12,.25); tone(784,.24,.4); },
  boop(){ tone(180,0,.22,'sine',.22); },
  pop(){ tone(880,0,.09,'triangle',.12); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3)); tone(1319,.55,.5); }
};

/* ---------- stars ---------- */
function starBurst(n=14) {
  const r = stage.getBoundingClientRect();
  for (let i=0;i<n;i++) {
    const s = document.createElement('div');
    s.className='star';
    const sz = 18+Math.random()*26;
    s.innerHTML = `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffd166" stroke="#e08900" stroke-width="1.2"/></svg>`;
    s.style.left = (r.width*(0.2+Math.random()*0.6))+'px';
    s.style.top = (r.height*(0.15+Math.random()*0.5))+'px';
    s.style.animationDelay = (Math.random()*.25)+'s';
    stage.appendChild(s);
    setTimeout(()=>s.remove(), 1400);
  }
}
function cheerMoti(){ const m=$('moti'); m.classList.remove('cheer'); void m.offsetWidth; m.classList.add('cheer'); }

/* ---------- parallax ---------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=0, ty=0;
addEventListener('deviceorientation', e => {
  if (e.gamma==null||reduced) return;
  tx = Math.max(-1,Math.min(1,e.gamma/30)); ty = Math.max(-1,Math.min(1,(e.beta-40)/30));
});
addEventListener('mousemove', e => {
  if (reduced) return;
  tx = (e.clientX/innerWidth-.5)*2; ty = (e.clientY/innerHeight-.5)*2;
});
(function par(){
  $('planeMid').style.transform = `translate(${tx*-14}px,${ty*-6}px)`;
  $('planeNear').style.transform = `translate(${tx*-26}px,${ty*-8}px)`;
  requestAnimationFrame(par);
})();

/* ---------- karaoke ---------- */
function renderWords(tappable) {
  captext.innerHTML = words.map((w,i)=>`<span class="w" data-i="${i}">${w.w}</span>`).join(' ');
  captext.classList.toggle('tappable', !!tappable);
  captext.querySelectorAll('.w').forEach(sp => {
    sp.addEventListener('pointerdown', ev => {
      if (!captext.classList.contains('tappable')) return;
      ev.preventDefault();
      playWord(+sp.dataset.i);
    });
  });
}
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime;
  let cur = -1;
  for (let i=0;i<words.length;i++) if (t>=words[i].s-0.05 && t<=words[i].e+0.08) { cur=i; break; }
  captext.querySelectorAll('.w').forEach((sp,i)=>sp.classList.toggle('spoken', i===cur));
});

/* ---------- flow ---------- */
function setDots() {
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('done', i<li);
    d.classList.toggle('now', i===li);
  });
}
function loadLetter() {
  const L = LETTERS[li], d = DATA.letters[L];
  words = d.words;
  setDots();
  $('letterBadge').textContent = L.toUpperCase();
  $('letterBadge').style.borderColor = COLORS[L];
  $('farImg').src = `img/abc/abc-${L}-far.jpg`;
  $('midImg').src = `img/abc/abc-${L}-mid.png`;
  $('nearImg').src = `img/abc/abc-${L}-near.png`;
  $('objImg').src = `img/abc/abc-${L}-${d.obj}.png`;
  $('objWrap').classList.remove('hidden');
  $('quizLayer').classList.remove('on');
  $('traceLayer').classList.remove('on');
  $('nextBtn').classList.remove('on');
  phase = 'watch';
  promptEl.textContent = 'Watch and listen...';
  renderWords(false);
  audio.src = `audio/abc/abc-${L}.mp3`;
  audio.play().catch(()=>{});
}
audio.addEventListener('ended', () => {
  if (phase !== 'watch') return;
  phase = 'read';
  promptEl.textContent = 'Now you try! Tap a word to hear it.';
  renderWords(true);
  $('nextBtn').classList.add('on');
});

$('nextBtn').addEventListener('click', () => { if (phase==='read') startQuiz(); });

/* ---------- quiz ---------- */
function startQuiz() {
  phase = 'quiz';
  $('nextBtn').classList.remove('on');
  const L = LETTERS[li];
  promptEl.textContent = `Which one starts with ${L.toUpperCase()}? Tap it!`;
  renderWords(false);
  const order = ['a','b','c'].sort(()=>Math.random()-.5);
  const ql = $('quizLayer');
  ql.innerHTML = '';
  order.forEach(k => {
    const obj = DATA.letters[k].obj;
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `<img src="img/abc/abc-${k}-${obj}.png" alt="${obj}">`;
    card.addEventListener('click', () => {
      if (phase!=='quiz' || card.classList.contains('right')) return;
      if (k === L) {
        card.classList.add('right'); sfx.chime(); starBurst(); cheerMoti();
        setTimeout(startTrace, 1500);
      } else {
        card.classList.remove('wiggle'); void card.offsetWidth; card.classList.add('wiggle');
        sfx.boop();
      }
    });
    ql.appendChild(card);
  });
  ql.classList.add('on');
}

/* ---------- trace ---------- */
function startTrace() {
  phase = 'trace';
  const L = LETTERS[li], d = DATA.letters[L];
  $('quizLayer').classList.remove('on');
  promptEl.textContent = `Trace the ${L.toUpperCase()} with your finger!`;
  $('traceLetter').src = `img/abc/letter-${L}.png`;
  $('traceLayer').classList.add('on');
  const box = $('traceBox'), cv = $('traceCanvas');
  const r = box.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  painted = new Uint8Array(24*24);
  letterCells = d.trace.reduce((a,b)=>a+b,0);
  paintedCount = 0;
  $('traceFill').style.width = '0%';
  const grid = d.trace;

  function paintAt(clientX, clientY) {
    const b = box.getBoundingClientRect();
    const gx = Math.floor((clientX-b.left)/b.width*24), gy = Math.floor((clientY-b.top)/b.height*24);
    const R = 2; // brush radius in cells
    for (let dy=-R;dy<=R;dy++) for (let dx=-R;dx<=R;dx++) {
      if (dx*dx+dy*dy > R*R+1) continue;
      const x=gx+dx, y=gy+dy;
      if (x<0||y<0||x>=24||y>=24) continue;
      const idx = y*24+x;
      if (grid[idx] && !painted[idx]) { painted[idx]=1; paintedCount++; }
    }
    const px = (clientX-b.left)/b.width*cv.width, py = (clientY-b.top)/b.height*cv.height;
    ctx.fillStyle = COLORS[L];
    ctx.beginPath(); ctx.arc(px, py, cv.width/24*1.6, 0, 7); ctx.fill();
    const pct = paintedCount/letterCells;
    $('traceFill').style.width = Math.min(100, pct*100)+'%';
    if (pct >= 0.75 && phase==='trace') {
      phase = 'tracedone';
      sfx.fanfare(); starBurst(20); cheerMoti();
      setTimeout(nextLetter, 1800);
    }
  }
  cv.onpointerdown = e => { tracing=true; cv.setPointerCapture(e.pointerId); paintAt(e.clientX,e.clientY); };
  cv.onpointermove = e => { if (tracing) paintAt(e.clientX,e.clientY); };
  cv.onpointerup = () => tracing=false;
  cv.onpointercancel = () => tracing=false;
}

function nextLetter() {
  li++;
  if (li >= LETTERS.length) {
    sfx.fanfare();
    $('finaleOverlay').classList.remove('hidden');
    setDots();
  } else {
    loadLetter();
  }
}

/* ---------- chrome ---------- */
$('startBtn').addEventListener('click', () => {
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  $('startOverlay').classList.add('hidden');
  li = 0; loadLetter();
});
$('againBtn').addEventListener('click', () => {
  $('finaleOverlay').classList.add('hidden');
  li = 0; loadLetter();
});
$('homeBtn').addEventListener('click', () => {
  audio.pause();
  $('finaleOverlay').classList.add('hidden');
  $('quizLayer').classList.remove('on');
  $('traceLayer').classList.remove('on');
  $('startOverlay').classList.remove('hidden');
});

fetch('img/abc/abc-data.json').then(r=>r.json()).then(d=>{ DATA=d; });
</script>
</body>
</html>
