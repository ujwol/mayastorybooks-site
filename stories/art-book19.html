<figure class="card"><img loading="lazy" src="img/book19/spread-01.jpg" alt="Book 19 — Spread 1">
<figcaption><b>Spread 1.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya, Moti, and Grandmother have come to Jomsom, high in Mustang. Brown hills roll all around. White mountains peek over the top. Green apple orchards line the valley floor. &quot;Every afternoon,&quot; says the orchard keeper, &quot;the wind comes to visit.&quot; Art: wide valley view — Maya (two black braids, red ribbons, rose-pink kurta with white-silver embroidery, white shalwar, pink sandals) and Grandmother (grey hair in bun, no glasses, maroon dress, cream shawl) walking a dirt path with Moti, small fluffy white-cream dog; apple orchards, stone houses, brown hills, snowy peaks; prayer flags strung between poles.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">माया, मोती र हजुरआमा मुस्ताङको जोमसोम आएका छन्। खैरा पहाडहरू वरिपरि लमतन्न छन्। सेता हिमालहरू माथिबाट झुल्कन्छन्। हरिया स्याउका बगैँचाहरू उपत्यकाको फेदमा लमतन्न छन्। &quot;हरेक दिउँसो,&quot; बगैँचाका मालिकले भने, &quot;हावा भेट्न आउँछ।&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Moti&#x27;s tail wags gently, prayer flags flutter. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-02.jpg" alt="Book 19 — Spread 2">
<figcaption><b>Spread 2.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At midday, it begins — a low whistle, far away. Then WHOOSH! Dust swirls. Prayer flags snap straight. Hats hold on tight! Maya&#x27;s red scarf flies right off her neck — up, up into the sky! &quot;My scarf!&quot; Maya cries. Moti barks and gives chase. Art: the gust hitting — dust clouds, flags flying horizontal, Maya reaching up as her red scarf spirals into the air; Moti leaping after it; Grandmother holding her shawl; apples trembling on branches.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मध्यदिनमा, सुरु हुन्छ — टाढा बिस्तारै सिठी। अनि हुइस्स! धुलो घुम्छ। प्रार्थनाका झण्डाहरू सोझा फहराउँछन्। टोपीहरू कस्सिएर बस्छन्! मायाको रातो सल उनको घाँटीबाट उड्छ — माथि, माथि आकाशतिर! &quot;मेरो सल!&quot; माया चिच्याइन्। मोती भुक्छ र पछ्याउँछ।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Clouds drift slowly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-03.jpg" alt="Book 19 — Spread 3">
<figcaption><b>Spread 3.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya runs fast — faster! — between the apple trees, grabbing at the air. But the harder she chases, the further the scarf dances. Over the wall! Around the corner! &quot;Come BAAACK!&quot; she shouts. The scarf twirls away, as if laughing. Art: Maya sprinting and swiping at the air, frustrated; the red scarf always just out of reach, dancing ahead; Moti running in confused circles; apples bobbing on branches.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">माया छिटो दौड्छिन् — झन् छिटो! — स्याउका रूखहरूबीच, हावामा समात्न खोज्दै। तर जति जोडले खेद्छिन्, सल त्यति टाढा नाच्छ। पर्खालपारि! कुनावरिपरि! &quot;फर्की आऊ!&quot; उनी चिच्याउँछिन्। सल घुम्दै टाढा जान्छ, मानौँ हाँस्दै।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Figures sway in a gentle dance, characters laugh warmly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-04.jpg" alt="Book 19 — Spread 4">
<figcaption><b>Spread 4.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother catches up, breathing hard. &quot;Stop, little one.&quot; She sits Maya on the stone wall. &quot;The wind cannot be caught,&quot; she says gently. &quot;The tighter you chase it, the more it runs. Sit. Breathe.&quot; Maya huffs... but she sits. Art: quiet moment on a low stone wall at the orchard&#x27;s edge; Grandmother&#x27;s arm around a pouting Maya; Moti flopped down panting; the red scarf visible as a distant speck in the sky.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमा हस्याङफस्याङ गर्दै पुग्नुभयो। &quot;रोक, सानी।&quot; उहाँले मायालाई ढुङ्गे पर्खालमा बसाउनुभयो। &quot;हावालाई समात्न सकिँदैन,&quot; उहाँले कोमलतासाथ भन्नुभयो। &quot;जति कस्सिएर खेद्छौ, त्यति धेरै भाग्छ। बस। सास फेर।&quot; मायाले फुर्किन्... तर बसिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Moti&#x27;s tail wags gently, a gentle breeze stirs the air. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-05.jpg" alt="Book 19 — Spread 5">
<figcaption><b>Spread 5.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Beside them, a row of prayer wheels spins all by itself — whirr, whirr, whirr! &quot;See?&quot; Grandmother smiles. &quot;Nobody pushes them. Nobody chases them. They just open themselves to the wind — and the wind moves them.&quot; Maya watches the spinning wheels, very quiet. Art: a row of brass prayer wheels blurring with speed; Maya and Grandmother watching side by side; prayer flags snapping overhead; the scarf nowhere in sight — calm, teaching mood.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">छेउमै, प्रार्थनाका पाङ्ग्राहरूको लहर आफैँ घुमिरहेको छ — घुर्र, घुर्र, घुर्र! &quot;हेर त?&quot; हजुरआमा मुसुक्क हाँस्नुभयो। &quot;कसैले धकेल्दैन। कसैले खेद्दैन। तिनीहरू हावाका लागि आफैँलाई खोल्छन् — अनि हावाले तिनीहरूलाई चलाउँछ।&quot; माया घुमिरहेका पाङ्ग्राहरू हेर्छिन्, एकदमै चुप।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Prayer wheels turn slowly, warm smiles glow. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-06.jpg" alt="Book 19 — Spread 6">
<figcaption><b>Spread 6.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Then a soft gust lifts the scarf — not wild now — floating up toward the old caves in the cliff, as if inviting her. This time Maya does not run. She climbs the stone path slowly, one careful step. Moti pads softly behind her. The caves are dark little mouths in the rock, hundreds of years old. Art: steep cliff face dotted with ancient cave openings; Maya climbing slowly and calmly, hands relaxed; the red scarf drifting gently near a cave mouth like an invitation; vast valley below.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अनि नरम झोक्काले सललाई उठायो — अहिले उग्र छैन — चट्टानका पुराना गुफाहरूतिर तैरँदै, मानौँ निम्तो दिँदै। यसपालि माया दौडिनन्। उनी ढुङ्गे बाटो बिस्तारै चढ्छिन्, एक होसियार पाइला। मोती बिस्तारै पछिपछि आउँछ। गुफाहरू चट्टानमा अँधेरा साना मुखहरू हुन्, सयौँ वर्ष पुराना।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Steady climbing, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-07.jpg" alt="Book 19 — Spread 7">
<figcaption><b>Spread 7.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Inside the cave it is cool and still. Old paintings curl across the walls. A tiny diyo glows on a stone ledge. Maya sits down and opens her hands in her lap. The wind breathes through the cave mouth... ...and lays the red scarf gently across her open palms, folded neatly, like a gift. &quot;Oh,&quot; whispers Maya. Art: dim cave interior lit by a small diyo flame; faded ancient murals; Maya sitting cross-legged with open upturned hands, the red scarf settling onto them; Moti lying still; wonder on Maya&#x27;s face.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">गुफाभित्र चिसो र शान्त छ। पुराना चित्रहरू भित्ताहरूमा घुम्रिएका छन्। ढुङ्गे छज्जामा सानो दियो चम्कन्छ। माया बस्छिन् र काखमा हातहरू खोल्छिन्। हावा गुफाको मुखबाट सास फेर्छ... ...अनि रातो सल बिस्तारै उनका खुला हत्केलाहरूमा राख्छ, सफासँग मोडिएको, उपहार जस्तै। &quot;ओहो,&quot; माया सुस्तरी भन्छिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Moti&#x27;s tail wags gently, diyo flames flicker warmly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-08.jpg" alt="Book 19 — Spread 8">
<figcaption><b>Spread 8.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">&quot;Long ago, monks lived in these caves,&quot; Grandmother says softly, sitting beside her. &quot;They learned what you just learned: you cannot hold the wind. You can only open your hands.&quot; Maya drapes the scarf around her neck — loosely, just resting there. Not tight at all. Art: warm lamplight; Grandmother telling the story; Maya listening, the scarf worn loose and easy; Moti asleep with his head on his paws; peace in the small cave.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">&quot;धेरै पहिले, यी गुफाहरूमा भिक्षुहरू बस्थे,&quot; हजुरआमाले सुस्तरी भन्नुभयो, छेउमा बस्दै। &quot;उनीहरूले तिमीले अहिले सिकेको कुरा सिके: हावालाई समात्न सकिँदैन। तिमीले आफ्ना हातहरू मात्र खोल्न सक्छौ।&quot; मायाले सल घाँटीमा बेर्छिन् — खुकुलो, बस त्यत्तिकै। कत्ति पनि कस्सिएको छैन।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Moti&#x27;s tail wags gently, lamp flames flicker warmly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-09.jpg" alt="Book 19 — Spread 9">
<figcaption><b>Spread 9.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At the cave mouth, Maya holds out her open hands and lets the wind run through her fingers. Wheee-ooo! It tickles! She laughs out loud. Moti&#x27;s long ears flap straight back, and he looks so funny that Maya laughs even harder. Art: Maya at the cave opening, hands open wide, laughing as wind streams through her fingers; Moti beside her with ears blown back comically; wind lines sweeping across the valley; pure joy.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">गुफाको मुखमा, मायाले आफ्ना खुला हातहरू फैलाउँछिन् र हावालाई औँलाहरूबीच बग्न दिन्छिन्। हुइँ-ओ! गुदगुदी लाग्छ! उनी ठूलो स्वरमा हाँस्छिन्। मोतीका लामा कानहरू सोझा पछाडि फहराउँछन्, अनि ऊ यति रमाइलो देखिन्छ कि माया झन् ठूलो हाँस्छिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Characters laugh warmly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-10.jpg" alt="Book 19 — Spread 10">
<figcaption><b>Spread 10.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Back in the village, the evening wind is perfect for one thing. Maya ties string to a red paper kite. This time she does not yank or pull — she lets the string OUT, loose and easy. Up it climbs — higher, higher — dancing with the wind. Moti jumps, trying to catch its tail. &quot;The looser I hold,&quot; Maya grins, &quot;the higher it flies!&quot; Art: golden evening light; Maya releasing kite string freely, the red diamond kite soaring high; Moti leaping beneath it; Grandmother watching from a stone wall, smiling; prayer flags and kite sharing the sky.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">गाउँमा फर्केर, साँझको हावा एउटा कुराका लागि उत्तम छ। मायाले रातो कागजी चङ्गामा डोरी बाँध्छिन्। यसपालि उनी तान्दिनन् वा झट्कार्दिनन् — उनले डोरी बाहिर छोड्छिन्, खुकुलो र सहज। माथि चढ्छ — झन् माथि, झन् माथि — हावासँग नाच्दै। मोती उफ्रन्छ, उसको पुच्छर समात्न खोज्दै। &quot;जति खुकुलो समात्छु,&quot; माया खिस्स हाँस्छिन्, &quot;त्यति अग्लो उड्छ!&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Steady climbing, Moti&#x27;s tail wags gently. Moonlight glows softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book19/spread-11.jpg" alt="Book 19 — Spread 11">
<figcaption><b>Spread 11.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
