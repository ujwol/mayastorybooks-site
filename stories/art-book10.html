<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">It is Dashain, and Kathmandu hums with it. From every rooftop, children are building and flying kites, and the sky is a festival of color. Grandmother spreads out red paper and golden ribbon on their rooftop. &quot;Help me, Maya,&quot; she says. &quot;This year we build the finest kite in the whole neighborhood.&quot; Moti runs round and round the red paper, wagging his tail.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">दशैं आएको छ, अनि काठमाडौँ त्यसैले गुञ्जिरहेको छ। हरेक छतबाट बच्चाहरू चङ्गा बनाउँदै र उडाउँदै छन्, अनि आकाश रङहरूको चाड हो। हजुरआमाले आफ्नो छतमा रातो कागज र सुनौलो फिता फैलाउनुहुन्छ। &quot;मलाई सघाऊ, माया,&quot; उहाँ भन्नुहुन्छ। &quot;यो वर्ष हामी सारा छिमेककै सबैभन्दा राम्रो चङ्गा बनाउँछौँ।&quot; मोती रातो कागज वरिपरि पुच्छर हल्लाउँदै घुमिरहन्छ।</div>

</figcaption></figure>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother ties the last knot, and the kite lifts — a big, proud RED kite with a GOLDEN border that flashes in the sun. Maya runs down the rooftop laughing, letting out the string, and the kite SOARS. &quot;Higher, higher!&quot; she calls, and Moti barks at the shadow racing over the rooftops.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमाले अन्तिम गाँठो बाँध्नुहुन्छ, अनि चङ्गा उठ्छ — घाममा चम्कने सुनौलो किनार भएको ठूलो, गर्विलो रातो चङ्गा! माया छतमा हाँस्दै दौडिन्छिन्, धागो छोड्दै, अनि चङ्गा उड्छ। &quot;झन् माथि, झन् माथि!&quot; उनी कराउँछिन्, अनि मोती छतहरूमाथि दौडने छायाँलाई भुक्छ।</div>

<div class="script en" contenteditable="true" spellcheck="false">Maya&#x27;s kite dances alone at the very top of the sky. Then — WHOOSH! A bigger, rough kite swoops down from nowhere and its line slices clean through Maya&#x27;s string. Snap! Maya&#x27;s red kite wobbles, spins — and tumbles away over the rooftops. Maya stares at the empty string in her hand.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मायाको चङ्गा आकाशको सबैभन्दा माथि एक्लै नाचिरहेको छ। अनि — हुइइइ! कतैबाट एउटा ठूलो, खस्रो चङ्गा झम्टिन्छ र उसको धागोले मायाको धागो सफासँग काट्छ। चट्! मायाको रातो चङ्गा हल्लिन्छ, घुम्छ — अनि छतहरूमाथिबाट खस्दै टाढा जान्छ। माया हातमा रहेको खाली धागोलाई हेरिरहन्छिन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">&quot;That was MY kite!&quot; Maya shouts, shaking her fist at the sky. Grandmother calls after her, but Maya is already running, Moti racing ahead, nose down. Across two rooftops they hop and scramble, following the red kite&#x27;s falling path — and Moti&#x27;s barking leads Maya to a small, poor-looking rooftop at the end of the street.</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">There he is. A small boy about Maya&#x27;s age, pulling Maya&#x27;s red kite down with his kite string — and in his other hand, a homemade kite stitched together from newspaper and colorful scraps, patched with flour paste. He sees Maya and lifts his chin, defiant. &quot;I didn&#x27;t steal anything,&quot; he says, hugging the red kite. &quot;My kite caught yours. That&#x27;s kite-fighting.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">ऊ त्यहीँ छ। माया जत्तिकै सानो केटो, आफ्नो चङ्गाको धागोले मायाको रातो चङ्गा तल तान्दै — अनि अर्को हातमा पत्रपत्रिका र रङ्गीचङ्गी टुक्राहरूबाट सिएको, पिठोको लेईले टालिएको घरेलु चङ्गा। उसले मायालाई देख्छ र ठाडो चिउँडो उठाउँछ। &quot;मैले केही चोरेको छैन,&quot; ऊ रातो चङ्गा अँगाल्दै भन्छ। &quot;मेरो चङ्गाले तिम्रो समात्यो। त्यो चङ्गा काटाकाट हो।&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya snatches her red kite back — then stops. The boy&#x27;s shirt has patches on the patches. His sandals are held together with string. His hands tremble a little. &quot;My family couldn&#x27;t buy paper or bamboo,&quot; he says quietly, looking down. &quot;I made mine from scraps. It has never won a fight.&quot; Moti sits beside the boy and leans against his leg.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मायाले आफ्नो रातो चङ्गा खोस्छिन् — अनि रोकिन्छिन्। केटोको कमिजमा टालोमाथि टालो छ। उसका चप्पलहरू डोरीले बाँधिएका छन्। उसका हातहरू अलि काँप्छन्। &quot;मेरो परिवारले कागज वा बाँस किन्न सकेन,&quot; ऊ बिस्तारै भन्छ, तल हेर्दै। &quot;मैले टुक्राहरूबाट बनाएँ। यसले कहिल्यै लडाइँ जितेको छैन।&quot; मोती केटोको छेउमा बस्छ र उसको खुट्टामा अडेस लाग्छ।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya looks at her fine red kite, then at his scrap-paper one. A grin spreads across her face. &quot;Rematch!&quot; she says, pointing at the sky. &quot;Tomorrow morning. You fly yours, I fly mine — and whoever flies longer WINS.&quot; The boy&#x27;s eyes go wide. &quot;Really?&quot; he whispers. Moti barks once, loud and happy, like an umpire.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मायाले आफ्नो राम्रो रातो चङ्गा हेर्छिन्, अनि उसको टुक्रे कागजको चङ्गा। उनको अनुहारमा मुस्कान फैलिन्छ। &quot;फेरि लडाइँ!&quot; उनी आकाशतिर औँला ठड्याउँदै भन्छिन्। &quot;भोलि बिहान। तिमी आफ्नो उडाऊ, म मेरो उडाउँछु — अनि जसले लामो उडाउँछ, उसैले जित्छ।&quot; केटोका आँखा ठूला हुन्छन्। &quot;साँच्चै?&quot; ऊ सुस्तरी भन्छ। मोती एक पटक ठूलो र खुसीले भुक्छ, अम्पायर जस्तै।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">But first — &quot;Nobody should fight kites with a scrap kite,&quot; Grandmother says, and brings out her bamboo, her paper, her paste pot. On Maya&#x27;s rooftop, the three of them build together: Grandmother ties the frame, Maya cuts the paper, and the boy — his name is Sabin — paints a blue star on the tail. Moti steals a ribbon and runs in circles while they all laugh.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तर पहिले — &quot;टुक्रे चङ्गाले कसैले चङ्गा लडाउनु हुँदैन,&quot; हजुरआमा भन्नुहुन्छ, अनि आफ्नो बाँस, कागज, लेईको भाँडो निकाल्नुहुन्छ। मायाको छतमा तीनै जना मिलेर बनाउँछन्: हजुरआमा फ्रेम बाँध्नुहुन्छ, माया कागज काट्छिन्, अनि केटो — उसको नाम सबिन हो — पुच्छरमा नीलो तारा रङ्गाउँछ। मोती फिता चोरेर हाँस्दै घुमिरहन्छ, अनि सबै हाँस्छन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">The next morning, the sky is crowded again. On two rooftops, two kites climb — Maya&#x27;s red kite with the golden border, and Sabin&#x27;s new blue kite with the painted star. They dance and dive around each other, swooping and twirling, neck and neck. The whole neighborhood watches from the rooftops.</div>

<div class="script en" contenteditable="true" spellcheck="false">Maya pulls left — Sabin pulls right — and CRASH! Their lines twist together in a big knotty tangle. Both kites wobble and land softly on the same rooftop. For a breath nobody speaks. Then Maya giggles. Then Sabin giggles. Then both of them are laughing so hard they have to sit down, and Moti jumps on both of them at once.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
</script></body></html>
