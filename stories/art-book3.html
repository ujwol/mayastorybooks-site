<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At bedtime, Grandmother tells Maya about a magical jungle far to the south, where tall grass whispers in the wind and a great one-horned rhino walks at sunrise. &quot;Tomorrow,&quot; Grandmother smiles, &quot;we will go and see it ourselves.&quot; Moti&#x27;s ears perk up. A jungle! An adventure!</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">सुत्ने बेलामा हजुरआमाले मायालाई टाढा दक्षिणको एउटा जादुमयी जङ्गलको कथा सुनाउनुभयो, जहाँ हावामा अग्लो घाँस सुसाउँछ र बिहान एउटा ठूलो एकसिङ्गे गैँडा हिँड्छ। &quot;भोलि,&quot; हजुरआमाले मुसुक्क हाँस्दै भन्नुभयो, &quot;हामी आफैँ गएर हेर्छौं।&quot; मोतीका कान ठाडा भए। जङ्गल! साहसिक यात्रा!</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">In the morning they ride a bus down, down from the hills to the flat green Terai. Buffaloes bathe in ponds. Banana trees wave hello. &quot;Is the jungle near?&quot; Maya asks, bouncing in her seat. &quot;Near,&quot; laughs Grandmother. &quot;Can you smell the rain in the grass?&quot;</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बिहान उनीहरू पहाडबाट तल तराईको हरियो फाँटतिर बस चढेर गए। भैँसीहरू पोखरीमा नुहाउँथे। केराका बोटहरू हात हल्लाउँथे। &quot;जङ्गल नजिक छ?&quot; मायाले उफ्रँदै सोधिन्। &quot;नजिकै छ,&quot; हजुरआमाले हाँस्दै भन्नुभयो। &quot;घाँसमा पानीको गन्ध आइरहेको छैन?&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Characters laugh warmly, soft rain falls. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>

<figcaption><b>Spread 3.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">In a Tharu village, a family welcomes them with tika on their foreheads and marigold garlands — for Maya, for Grandmother, even for little Moti! A tourist family from far away gets garlands too. &quot;In Nepal,&quot; says their guide, Raju, &quot;a guest is like a god in our home.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">थारू गाउँमा एउटा परिवारले उनीहरूलाई निधारमा टीका र सयपत्री माला लगाएर स्वागत गर्‍यो — मायालाई, हजुरआमालाई, सानो मोतीलाई समेत! टाढाबाट आएको पर्यटक परिवारले पनि माला पाए। &quot;नेपालमा,&quot; उनीहरूका गाइड राजुले भने, &quot;पाहुना हाम्रो घरमा भगवान् जस्तै हुन्।&quot;</div>

</figcaption></figure>

<figcaption><b>Spread 4.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">That evening the village gathers. Drums boom! Dancers spin with sticks, tapping in rhythm — the Tharu stick dance. Maya claps along. Moti tries to dance too, and everyone laughs. &quot;Can you clap the rhythm with us?&quot; the dancers ask.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">साँझ गाउँलेहरू भेला भए। ढोल बज्यो! नाच्नेहरू लठ्ठी घुमाउँदै फन्को मारे, तालमा ठोक्दै — थारू लठ्ठी नाच। मायाले ताली बजाइन्। मोती पनि नाच्न खोज्यो, अनि सबै हाँसे। &quot;हामीसँगै ताल मिलाएर ताली बजाउन सक्छौ?&quot; नाच्नेहरूले सोधे।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Before the sun wakes, they climb into an open jeep. Mist floats over the tall grass. &quot;Quiet as a mouse,&quot; whispers Raju. &quot;The jungle is waking up.&quot; Maya holds her breath. Somewhere, a peacock calls: &quot;May-awe! May-awe!&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">घाम नउठ्दै उनीहरू खुला जिपमा चढे। अग्लो घाँसमाथि कुहिरो तैरिरहेको थियो। &quot;मुसा जस्तै चुपचाप,&quot; राजुले सुस्तरी भने। &quot;जङ्गल बिउँझँदै छ।&quot; मायाले सास रोकिन्। कतै मयूर करायो!</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">A spotted deer leaps through the grass. A crocodile naps by the river, still as a log. High above, an eagle circles. &quot;So many neighbors!&quot; Maya whispers. &quot;Shh,&quot; says Grandmother, smiling, &quot;we are guests in their home.&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Then — the grass parts. Out walks a one-horned rhino, big as a jeep, calm as a king. Its skin is like armor, its ears swivel like little satellites. Maya&#x27;s eyes grow round. &quot;Can you see his one horn?&quot; she whispers. There he goes — step, step, step through the golden grass.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">त्यसपछि — घाँस फाट्यो। एउटा एकसिङ्गे गैँडा निस्कियो, जिप जत्रो ठूलो, राजा जस्तै शान्त। उसको छाला कवच जस्तै, कानहरू साना स्याटलाइट जस्तै घुम्थे। मायाका आँखा ठूला भए। &quot;उसको एउटा सिङ देख्यौ?&quot; उनले सुस्तरी सोधिन्। ऊ गयो — पाइला, पाइला, पाइला सुनौलो घाँसमा।

<div class="script en" contenteditable="true" spellcheck="false">Behind the big rhino trots a baby, small and wobbly, staying close to its mother. The mother looks at the jeep, then keeps walking. She is not afraid — she knows the people here protect her. &quot;She trusts us,&quot; says Raju softly, &quot;because we keep the jungle safe.&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Suddenly Moti sees the baby rhino and — &quot;WOOF!&quot; He wants to play! &quot;Shh, Moti!&quot; Maya hugs him close. &quot;We must be quiet. Loud noises frighten them.&quot; Moti puts his head on Maya&#x27;s lap. Even puppies can learn jungle manners.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अचानक मोतीले बच्चा गैँडा देख्यो अनि — &quot;भुक्!&quot; ऊ खेल्न चाहन्थ्यो! &quot;श्श, मोती!&quot; मायाले उसलाई अँगालो हालिन्। &quot;हामी चुपचाप बस्नुपर्छ। ठूलो आवाजले उनीहरूलाई तर्साउँछ।&quot; मोतीले मायाको काखमा टाउको राख्यो। कुकुरका बच्चाहरूले पनि जङ्गलको शिष्टाचार सिक्न सक्छन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">Raju tells them: long ago, very few rhinos were left. But the people of Nepal guarded the jungle, and now rhino families walk here again. Maya feels proud. &quot;When I grow up,&quot; she says, &quot;I will guard the jungle too.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">राजुले सुनाए: धेरै पहिले, थोरै मात्र गैँडाहरू बाँकी थिए। तर नेपालका मानिसहरूले जङ्गलको रक्षा गरे, अनि अहिले गैँडाका परिवारहरू यहाँ फेरि हिँड्छन्। मायालाई गर्व लाग्यो। &quot;म ठूली भएपछि,&quot; उनले भनिन्, &quot;म पनि जङ्गलको रक्षा गर्छु।&quot;</div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
</script></body></html>
