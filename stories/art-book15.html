<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya sits at a low wooden desk by the window, writing invitation letters in her very best handwriting. Moti sits beside her, &quot;helping&quot; — his little paws have left ink prints on the desk. Grandmother folds the finished letters, smiling. Dear friends, Maya wrote. You are invited to our big festival in my lane. There will be music, and dancing, and honey. Please come!</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">झ्यालछेउको सानो काठको डेस्कमा माया आफ्नो राम्रोभन्दा राम्रो अक्षरमा निमन्त्रणाका चिठीहरू लेख्दै थिइन्। मोती छेउमै बसेर &quot;सघाउँदै&quot; थियो — उसका साना पञ्जाका मसीका छाप डेस्कभरि थिए! हजुरआमाले मुसुक्क हाँस्दै हरेक चिठी मोड्नुहुन्थ्यो। &quot;प्यारा साथीहरू,&quot; मायाले लेखिन्, &quot;मेरो गल्लीको ठूलो उत्सवमा तपाईंहरूलाई निम्तो छ। त्यहाँ सङ्गीत, नाच र मह हुनेछ। कृपया आउनुहोस्!&quot;</div>

<figure class="card"><img loading="lazy" src="img/book15/spread-02.jpg" alt="Book 15 — Spread 2">
<figcaption><b>Spread 2.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The lane decorates for the festival. Maya and Grandmother string long garlands of orange and yellow marigolds across the doorways. Rows of little clay oil lamps wait on a tray. Moti has gotten tangled in a garland and looks very proud of it. Marigolds for every door. Lamps for every step. Maya&#x27;s lane had never looked so beautiful.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">सम्पूर्ण गल्ली उत्सवका लागि सिँगारियो। माया र हजुरआमाले सुन्तला र पहेँला सयपत्रीका लामा मालाहरू हरेक ढोकामा टाँग्नुभयो। साना माटोका दियोहरू थालमा साँझको प्रतीक्षामा थिए। मोती मालामा अल्झिएर बस्यो — अनि ऊ एकदमै गर्विलो देखिन्थ्यो! &quot;हरेक ढोकाका लागि सयपत्री। हरेक पाइलाका लागि दियो। मायाको गल्ली कहिल्यै यति सुन्दर देखिएको थिएन।&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Marigold petals drift softly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Bir Dai arrives up the lane, waving, a big basket of golden honey strapped to his back. Maya runs to meet him, arms wide. Moti dances around his legs. &quot;Bir Dai! You came!&quot; Maya cried. &quot;I brought the sweetest honey in the hills,&quot; laughed Bir Dai. &quot;A festival needs honey!&quot;</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">&quot;वीर दाइ! तपाईं आउनुभयो!&quot; माया गल्लीतिर दौडिन्, हात फिँजाएर। वीर दाइ — दयालु मह शिकारी, रातो बुट्टे ढाका टोपी लगाएका — हात हल्लाउँदै फर्किनुभयो, काँधमा सुनौलो महको ठूलो टोकरी। मोती उहाँका खुट्टावरिपरि नाच्यो। &quot;पहाडकै सबैभन्दा मीठो मह ल्याएको छु,&quot; वीर दाइ हाँस्नुभयो। &quot;उत्सवलाई मह चाहिन्छ!&quot;</div>

<figcaption><b>Spread 4.</b>

<div class="script en" contenteditable="true" spellcheck="false">Everyone gasps — a yeti is coming down the mountain path! But it is their yeti, in his giant red knitted scarf, waving shyly with one huge paw. The gasps turn into laughter, and Maya runs to hug his furry leg. &quot;He came!&quot; cheered Maya. &quot;The yeti came to our festival!&quot;</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">सबैले सास रोके — यती पहाडको बाटोबाट झर्दै थियो! तर यो तिनीहरूकै यती थियो — अग्लो, झुस्स रौं भएको सेतो-खैरो, हास्यास्पद दयालु पहेँला आँखा, उसको ठूलो रातो बुनेको सल फहराउँदै — एउटा ठूलो पञ्जाले लजाउँदै हात हल्लाउँदै। सासहरू हाँसोमा परिणत भए। माया उसको रौं भएको खुट्टा अँगाल्न दौडिन्। &quot;ऊ आयो!&quot; मायाले खुसीले चिच्याइन्। &quot;यती हाम्रो उत्सवमा आयो!&quot;</div>

<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Characters laugh warmly, gentle running. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>

<div class="script en" contenteditable="true" spellcheck="false">The kite boy arrives, his patchwork kite tucked under his arm, smiling shyly. Maya waves him over, and Moti sniffs the kite&#x27;s paper tail with great curiosity. &quot;Will you fly it with us?&quot; Maya asked. The kite boy nodded, brave and happy.</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The old monk arrives, laughing his wonderful laugh, prayer beads in his hand. He sprinkles flower petals over the lane and gives Maya a blessing, tapping her forehead gently. &quot;Blessings for a happy festival,&quot; laughed the monk, &quot;and for every friend in this lane!&quot;</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बूढा लामा आउनुभयो, उहाँको अद्भुत हाँसो हाँस्दै, हातमा जपमाला। उहाँले गल्लीभरि फूलका पत्तीहरू छर्कनुभयो र मायाको निधारमा बिस्तारै आशीर्वाद दिनुभयो। &quot;खुसी उत्सवको शुभकामना,&quot; लामा हाँस्नुभयो, &quot;अनि यस गल्लीका हरेक साथीलाई!&quot;</div>

<div class="script en" contenteditable="true" spellcheck="false">Everyone shares the feast at a long low table in the middle of the lane — momos, rice, lentils, vegetables, and Bir Dai&#x27;s honey drizzled over everything. Plates are passed hand to hand. Even the yeti gets a honey-covered momo. They ate and ate. Everything tasted better because everyone was there.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">सबैले गल्लीको बीचमा लामो निहुरिएको टेबलमा भोज बाँडे — मोमो, भात, दाल, तरकारी, अनि वीर दाइको मह सबैमाथि छर्किएको। थालहरू हातैहात बाँडिए, सबैले सबैलाई पस्कँदै। यतीले पनि मह लागेको मोमो पायो — उसको विशाल पञ्जामा त्यो निकै सानो देखिन्थ्यो! &quot;उनीहरूले खाए र खाए। सबैजना त्यहाँ भएकाले सबैथोक झन् मीठो लाग्यो।&quot;</div>

<div class="script en" contenteditable="true" spellcheck="false">Madal drums boom, cymbals clash, and the lane dances! Grandmother claps, Bir Dai stomps, the kite boy twirls — and the yeti dances. Oh, the yeti dances! He spins his big furry body, his red scarf flying, and everyone laughs and laughs. The yeti did the silliest, happiest dance the lane had ever seen.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मादल गुञ्जियो! झ्याली बज्यो! सम्पूर्ण गल्ली नाच्यो! हजुरआमा ताली बजाउनुभयो, वीर दाइ खुट्टा बजाउनुभयो, चङ्गा केटो घुम्यो, लामा डोलिनुभयो — अनि यती नाच्यो। ओहो, यती नाच्यो! उसले आफ्नो ठूलो रौं भएको शरीर घुमायो, घुमायो, उसको ठूलो रातो सल फहराउँदै, अनि सबै हाँसे र हाँसे र हाँसे। &quot;यतीले गल्लीले कहिल्यै नदेखेको सबैभन्दा रमाइलो, सबैभन्दा खुसी नाच नाच्यो।&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">They fly kites together in the festival sky — the kite boy&#x27;s patchwork kite, Maya&#x27;s red kite, and one enormous kite that the yeti holds with his giant paws. Moti barks at the kites from below. Up, up, up they went — a whole sky full of color.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">उनीहरूले उत्सवको आकाशमा सँगै चङ्गा उडाए — चङ्गा केटोको टुक्राटुक्री चङ्गा, मायाको रातो चङ्गा, अनि एउटा विशाल चङ्गा जुन यतीले आफ्ना ठूला पञ्जाले समातेको थियो। माथि, माथि, माथि उनीहरू गए — सम्पूर्ण आकाश रङ्गले भरियो। मोती तलबाट चङ्गाहरूलाई भुक्यो, अलि माथि उफ्रे समात्न सक्थ्यो भन्ने पक्का!</div>

<div class="script en" contenteditable="true" spellcheck="false">As evening comes, everyone gathers around the fire. Grandmother tells the story of their year — the yeti&#x27;s sneeze, the kite that flew away, the monk at the stupa, the honey hunt in the hills. Everyone listens, smiling at the memories. &quot;What a year we had,&quot; said Grandmother. &quot;And what friends we made.&quot;</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">साँझ पर्दा, सबै आगोवरिपरि भेला भए। हजुरआमाले उनीहरूको वर्षको कथा सुनाउनुभयो। हिउँमा यतीको ठूलो हाच्छिउँ। काठमाडौँमाथि उडेको चङ्गा। ठूलो स्तूपमा हाँस्ने लामा। अग्ला पहाडमा मह सिकार। सबैले सम्झनामा मुसुक्क हाँस्दै सुने। यती रौंमुनि लजायो। &quot;&quot;कस्तो वर्ष बित्यो,&quot; हजुरआमाले भन्नुभयो। &quot;अनि कस्ता साथीहरू बनायौँ।&quot;&quot;</div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
