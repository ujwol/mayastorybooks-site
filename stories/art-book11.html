<div class="script en" contenteditable="true" spellcheck="false">Tihar has come to the village! Marigold garlands hang from every door. The air smells of flowers and sweet oil. In every courtyard, sisters sit beside their brothers, ready for Bhai Tika. Maya stands at the edge of a courtyard and watches — very quietly.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तिहार गाउँमा आयो! सयपत्री मालाहरू हरेक ढोकाबाट झुन्डिएका छन्। हावामा फूल र मीठो तेलको बास्ना छ। हरेक आँगनमा दिदीबहिनीहरू आफ्ना दाजुभाइको छेउमा बसेका छन्, भाइटीकाका लागि तयार। माया आँगनको छेउमा उभिएर हेरिरहेकी छन् — एकदम चुपचाप।</div>

<figure class="card"><img loading="lazy" src="img/book11/spread-02.jpg" alt="Book 11 — Spread 2">
<figcaption><b>Spread 2.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">One by one, the sisters place the saptarangi tika — seven bright colors — on their brothers&#x27; foreheads. Red, yellow, green, blue... each line is a wish for a long, happy life. Maya watches the laughter and the hugs. Her own forehead feels very empty. Moti presses his warm head against her leg.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">एकपछि अर्को गर्दै दिदीबहिनीहरूले दाजुभाइको निधारमा सप्तरङ्गी टीका लगाइदिन्छन् — सात चम्किला रङहरू। रातो, पहेँलो, हरियो, नीलो... हरेक रेखा लामो, खुसी जीवनको कामना हो। माया हाँसो र अँगालोहरू हेरिरहेकी छन्। उनको आफ्नै निधार एकदम खाली लाग्छ। मोतीले आफ्नो न्यानो टाउको उनको खुट्टामा टाँसेको छ।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">That evening, Maya sits beside Grandmother on the porch. Oil lamps flicker in little rows. &quot;Aama,&quot; Maya whispers, &quot;everyone has a brother for Bhai Tika. Everyone but me.&quot; Grandmother listens for a long time. Then she smiles — the warmest smile in the world.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">त्यो साँझ माया हजुरआमाको छेउमा पिँढीमा बसिन्। तेलका बत्तीहरू साना लहरहरूमा झिलमिलाइरहेका छन्। &quot;आमा,&quot; मायाले सुस्तरी भनिन्, &quot;भाइटीकाका लागि सबैसँग दाजुभाइ छन्। मबाहेक सबैसँग।&quot; हजुरआमाले लामो समयसम्म सुन्नुभयो। अनि मुसुक्क हाँस्नुभयो — संसारकै सबैभन्दा न्यानो हाँसो।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">&quot;My child,&quot; says Grandmother, wrapping her cream shawl around Maya, &quot;listen to the old custom. If you have no brother, you do not have to wish for one. You may CHOOSE one. Choose with your heart, and he will be your brother for real — forever.&quot; Maya&#x27;s eyes go wide. She already knows. She has known for a long time.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">&quot;मेरी नानी,&quot; हजुरआमाले भन्नुभयो, आफ्नो क्रिम शाल मायालाई बेर्दै, &quot;पुरानो चलन सुन। तिम्रो दाजुभाइ छैन भने, तिमीले कामना गर्नैपर्छ भन्ने छैन। तिमीले छान्न सक्छौ। मनले छान, अनि उनी तिम्रो दाजुभाइ हुनेछन् — साँच्चै, सधैँभरि।&quot; मायाका आँखा ठूला भए। उनलाई थाहा छ। उनलाई धेरै पहिलेदेखि थाहा छ।</div>

<div class="script en" contenteditable="true" spellcheck="false">Next door lives a boy of eight — kind eyes, neat side-parted black hair, a teal-blue kurta and white churidar. He shares his guavas with the little children. He once carried Maya&#x27;s basket all the way home. Maya runs to Grandmother. &quot;Him!&quot; she says, pointing. &quot;He is the kindest boy I know!&quot; Grandmother laughs. &quot;Then he is already your brother. Now we will make it so.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">छेउको घरमा आठ वर्षको एउटा केटो बस्छ — दयालु आँखा, चिटिक्क परेको कपाल, हरियो-नीलो कुर्ता र सेतो चुरिदार। उसले साना नानीबाबुहरूसँग आफ्ना अम्बा बाँड्छ। एकपटक उसले मायाको डोको घरसम्मै बोकेर ल्याइदिएको थियो। माया हजुरआमातिर दौडिइन्। &quot;उही!&quot; उनले औँलाले देखाउँदै भनिन्। &quot;उनी मलाई थाहा भएकामध्ये सबैभन्दा दयालु केटो हुन्!&quot; हजुरआमा हाँस्नुभयो। &quot;त्यसो भए उनी तिम्रो दाजुभाइ भइसकेछन्। अब हामी यसलाई पक्का गर्छौं।&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Morning! Maya wears her festival clothes. On a brass plate she arranges everything — a small dish of the seven tika colors, marigold petals, rice, and sweets. The boy sits before her, a little shy, a little proud, in his teal-blue kurta. Maya dips her finger in the first color. Her hand is steady. This is the most important art she will ever make.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बिहान! मायाले चाडपर्वका लुगा लगाएकी छन्। पीतलको थालमा उनले सबै कुरा मिलाएकी छन् — सात टीका रङहरूको सानो कटौरा, सयपत्रीका पातहरू, चामल, र मिठाइ। केटो उनको अगाडि बसेको छ, अलि लजाउँदै, अलि गर्व गर्दै, आफ्नो हरियो-नीलो कुर्तामा। मायाले आफ्नो औँला पहिलो रङमा डुबाइन्। उनको हात स्थिर छ। यो उनले बनाउने सबैभन्दा महत्त्वपूर्ण कला हो।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Red, orange, yellow, green, blue, indigo, violet — line by line, Maya paints the saptarangi tika on his forehead. Seven colors, seven wishes: for his health, his happiness, his long, long life. &quot;Now you are my brother,&quot; she says softly. &quot;For real.&quot; The boy&#x27;s warm brown eyes shine. A small red tika glows on his forehead like a tiny sun.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">रातो, सुन्तला, पहेँलो, हरियो, नीलो, गाढा नीलो, बैजनी — रेखा-रेखा गर्दै मायाले उसको निधारमा सप्तरङ्गी टीका लगाइन्। सात रङ, सात कामना: उसको स्वास्थ्य, उसको खुसी, उसको लामो, लामो जीवनका लागि। &quot;अब तिमी मेरो दाजुभाइ हौ,&quot; उनले सुस्तरी भनिन्। &quot;साँच्चै।&quot; केटोका न्यानो खैरो आँखा चम्किए। उसको निधारमा सानो रातो टीका सानो सूर्य जस्तै चम्कियो।</div>

<div class="script en" contenteditable="true" spellcheck="false">Next comes the sagun — the plate of good fortune. Maya offers him fruits and sweets, one by one. He accepts each with both hands, the way Grandmother taught her, and bows his head. Moti sits up very straight beside them, hoping a sweet might fall his way. Grandmother watches from the doorway, her eyes all soft and shining.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अब पालो सगुनको — शुभ भाग्यको थाल। मायाले उसलाई फलफूल र मिठाइ एक-एक गर्दै दिइन्। उसले हरेकलाई दुवै हातले स्वीकार गर्‍यो, जसरी हजुरआमाले सिकाउनुभएको थियो, अनि टाउको निहुर्‍यायो। मोती उनीहरूको छेउमा एकदम सोझो बसेको छ, एउटा मिठाइ खस्ला कि भनेर आशा गर्दै। हजुरआमा ढोकाबाट हेरिरहनुभएको छ, आँखाहरू नरम र चम्किला।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The boy reaches into his pocket and brings out a small painted wooden top — red and yellow swirls, spinning-bright. &quot;For my sister,&quot; he says, placing it in Maya&#x27;s hands. &quot;So you will always remember this day.&quot; Maya hugs it tight to her chest. It is the best gift in the whole world. &quot;Spin it for me,&quot; she laughs — and he does, right there on the courtyard floor.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">केटोले आफ्नो खल्तीबाट एउटा सानो रङ्गिएको काठको लट्टू निकाल्यो — रातो र पहेँलो घुम्रेका, घुम्दा चम्किने। &quot;मेरी बहिनीका लागि,&quot; उसले भन्यो, मायाका हातमा राखिदिँदै। &quot;ताकि तिमीले यो दिन सधैँ सम्झिरहौ।&quot; मायाले त्यसलाई छातीमा कसिलो अँगालो हालिन्। यो सारा संसारकै सबैभन्दा राम्रो उपहार हो। &quot;मेरा लागि घुमाइदेऊ न,&quot; उनी हाँसिन् — अनि उसले घुमाइदियो, त्यहीँ आँगनको भुइँमा।</div>

<div class="script en" contenteditable="true" spellcheck="false">At dusk they light oil lamps together — one, two, three, a whole row along the courtyard wall. Little flames dance in the evening breeze. The marigolds glow like captured sunshine. &quot;Make a wish,&quot; whispers her brother. Maya closes her eyes and wishes — for him, always. Side by side, brother and sister, they watch the flames stand tall.</div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
