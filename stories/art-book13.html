<figure class="card"><img loading="lazy" src="img/book13/spread-01.jpg" alt="Book 13 — Spread 1">

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya, Grandmother, and Moti ride in a little bus winding through green hills on the road to Pokhara. Terraced fields climb the slopes, banana trees sway, and far ahead, through a gap in the hills, the white tops of the Annapurnas peek out. Maya presses her face to the window. &quot;Are those the mountains, Grandmother? They look close enough to touch!&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">माया, हजुरआमा, र मोती हरियो पहाडहरूबीच घुम्ती पर्दै पोखराको बाटोमा सानो बसमा यात्रा गर्छन्। खेतबारीहरू डाँडामा चढ्छन्, केराका बोटहरू हल्लिन्छन्, अनि टाढा अगाडि, पहाडहरूको खाली ठाउँबाट, अन्नपूर्णका सेता टुप्पाहरू झल्कन्छन्। माया झ्यालमा अनुहार टाँस्छिन्। &quot;ती हिमाल हुन्, हजुरआमा? छुन मिल्ने जस्तै नजिक देखिन्छन्!&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Steady climbing, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-02.jpg" alt="Book 13 — Spread 2">
<figcaption><b>Spread 2.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At last — Phewa Lake! The water is so still that the great Annapurna range is painted twice: once in the sky, and once upside-down in the lake, perfectly. Maya stands on the shore, mouth open. &quot;Grandmother — there are TWO mountains! One fell into the water!&quot; Grandmother laughs. &quot;No, little one. The lake is just holding the sky for us to see.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अन्ततः — फेवा ताल! पानी यति शान्त छ कि ठूलो अन्नपूर्ण शृङ्खला दुइपटक चित्रिएको छ: एकपटक आकाशमा, र एकपटक तालमा उल्टो, पूरै मिलेको। माया किनारमा उभिएकी छन्, मुख खुला। &quot;हजुरआमा — दुइटा हिमाल छन्! एउटा पानीमा खस्यो!&quot; हजुरआमा हाँस्नुभयो। &quot;होइन, नानी। तालले हामीलाई देखाउन आकाशलाई बोकेको मात्र हो।&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Water ripples softly, characters laugh warmly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-03.jpg" alt="Book 13 — Spread 3">
<figcaption><b>Spread 3.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">They hire a wooden doongha boat — long and narrow, painted bright blue and red. A kind old boatman with a striped cap helps them aboard. Maya sits in the middle, Grandmother settles her shawl, and Moti perches at the very front like a captain. &quot;Push off!&quot; calls the boatman, and the boat glides into the mirror.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">उनीहरूले एउटा काठको डुङ्गा भाडामा लिन्छन् — लामो र साँघुरो, चम्किलो नीलो र रातो रङ्गिएको। धर्के टोपी लगाएका दयालु बूढा डुङ्गेवालले उनीहरूलाई चढ्न सघाए। माया बीचमा बसिन्, हजुरआमाले आफ्नो शाल मिलाउनुभयो, अनि मोती कप्तान जस्तै सबैभन्दा अगाडि बस्यो। &quot;ठेल!&quot; डुङ्गेवालले कराए, अनि डुङ्गा ऐनामा चिप्लियो।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-04.jpg" alt="Book 13 — Spread 4">
<figcaption><b>Spread 4.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">In the middle of the lake sits a tiny green island, and on it the Tal Barahi temple with its white dome and golden top. The boat circles the island. Maya folds her hands together like Grandmother and bows her head. Bells tinkle in the breeze. &quot;Even the temple has a twin in the water,&quot; whispers Maya.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तालको बीचमा एउटा सानो हरियो टापु छ, अनि त्यसमा सेतो गुम्बज र सुनौलो टुप्पो भएको तालबाराही मन्दिर। डुङ्गाले टापुलाई घुम्छ। मायाले हजुरआमा जस्तै हात जोडिन् र टाउको निहुर्‍याइन्। हावामा घण्टीहरू टिनटिनाउँछन्। &quot;मन्दिरको पनि पानीमा जुम्ल्याहा छ,&quot; मायाले सुस्तरी भनिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Water ripples softly, the lake ripples softly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-05.jpg" alt="Book 13 — Spread 5">
<figcaption><b>Spread 5.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya trails her fingers in the cool lake water and watches her ripples chase the mountain&#x27;s reflection. Little silver fish dart beneath her hand — zip, zip, zip! &quot;Careful, little fish,&quot; she giggles. Moti watches the fish with wide eyes, his nose nearly touching the water.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मायाले चिसो तालको पानीमा आफ्ना औँलाहरू तैराइन् र आफ्ना छालहरूले हिमालको परछाइँलाई खेदेको हेरिन्। साना चाँदीका माछाहरू उनको हातमुनिबाट दौडन्छन् — जिप, जिप, जिप! &quot;बिस्तारै, साना माछा,&quot; उनी खित्का छोड्दै भनिन्। मोतीले माछाहरूलाई ठूला आँखाले हेर्छ, उसको नाक पानीलाई छुने जस्तै।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Water ripples softly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-06.jpg" alt="Book 13 — Spread 6">
<figcaption><b>Spread 6.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Moti leans over the edge and sees another little white dog looking back at him from the water. He barks — &quot;Woof!&quot; — and the water-dog barks back without a sound! Moti tilts his head. He paws at the water. Splash! Maya and Grandmother laugh and laugh. &quot;That is you, silly Moti!&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मोती किनारमाथि झुक्यो र पानीबाट उसलाई फर्केर हेर्ने अर्को सानो सेतो कुकुर देख्यो। ऊ भुक्यो — &quot;भुक्!&quot; — अनि पानीको कुकुरले आवाजै ननिकाली फर्केर भुक्यो! मोतीले टाउको ढल्कायो। उसले पानीमा पञ्जा हाल्यो। छप्ल्याक! माया र हजुरआमा हाँस्नुभयो र हाँस्नुभयो। &quot;त्यो तिमी हौ, मूर्ख मोती!&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Water ripples softly, characters laugh warmly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-07.jpg" alt="Book 13 — Spread 7">
<figcaption><b>Spread 7.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Back on shore, they wander the lakeside bazaar — bright stalls of flower garlands, wooden flutes, and sparkling bracelets. Grandmother buys Maya a small treasure: a tiny brass boat, just like their doongha. Maya holds it up to the sun. &quot;Now I will always have the lake with me.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">किनारमा फर्केर उनीहरू तालछेउको बजारमा घुम्छन् — फूलका मालाहरू, काठका बाँसुरीहरू, र चम्किला चुराहरूका उज्याला पसलहरू। हजुरआमाले मायाका लागि एउटा सानो खजाना किन्नुभयो: उनीहरूको डुङ्गा जस्तै सानो पीतलको डुङ्गा। मायाले त्यसलाई घामतिर उठाइन्। &quot;अब मसँग ताल सधैँ हुनेछ।&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Flowers sway gently, the lake ripples softly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-08.jpg" alt="Book 13 — Spread 8">
<figcaption><b>Spread 8.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">High above the lake, paragliders drift down from the green hilltop — red, yellow, blue, pink — like giant colored birds floating on the wind. Maya waves up at them. &quot;Look, Moti! The sky has butterflies!&quot; One paraglider swoops low, and the pilot waves back at her.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तालमाथि अग्लोमा प्याराग्लाइडरहरू हरियो डाँडाको टुप्पोबाट ओर्लन्छन् — रातो, पहेँलो, नीलो, गुलाबी — हावामा तैरिरहेका ठूला रङ्गीन चराहरू जस्तै। मायाले तिनीहरूलाई हात हल्लाइन्। &quot;हेर, मोती! आकाशमा पुतलीहरू छन्!&quot; एउटा प्याराग्लाइडर तल झुक्यो, अनि पाइलटले उनलाई फर्केर हात हल्लायो।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Moti&#x27;s tail wags gently, birds flutter. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-09.jpg" alt="Book 13 — Spread 9">
<figcaption><b>Spread 9.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">As the sun sinks low, something magical happens: the white Annapurnas turn soft pink, then gold, then rose — and the lake turns pink too. Maya gasps. &quot;The mountains are blushing, Grandmother!&quot; They sit very still in the boat and watch the whole world turn the color of a marigold petal.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">घाम तल झर्दै जाँदा केही जादुमयी हुन्छ: सेता अन्नपूर्णहरू नरम गुलाबी हुन्छन्, अनि सुनौलो, अनि गुलाबी — अनि ताल पनि गुलाबी हुन्छ। मायाले सास रोकिन्। &quot;हिमालहरू लजाइरहेका छन्, हजुरआमा!&quot; उनीहरू डुङ्गामा एकदम चुपचाप बस्छन् र पूरै संसार सयपत्रीको पातको रङ्ग भएको हेर्छन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Marigold petals drift softly, the lake ripples softly. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-10.jpg" alt="Book 13 — Spread 10">
<figcaption><b>Spread 10.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At dusk, Grandmother places a tiny floating lamp — a little leaf boat holding a flickering flame — onto the dark water. It drifts away, its light dancing beside the first stars. Maya watches it go. &quot;Where will it travel?&quot; Grandmother smiles. &quot;Wherever the lake wants to take it.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">साँझमा हजुरआमाले एउटा सानो तैरने बत्ती — झिलमिलाउने ज्वाला बोकेको सानो पातको डुङ्गा — अँध्यारो पानीमा राख्नुभयो। त्यो टाढा बग्छ, यसको उज्यालो पहिला ताराहरूको छेउमा नाच्दै। मायाले त्यसलाई गएको हेरिन्। &quot;त्यो कहाँ यात्रा गर्ला?&quot; हजुरआमा मुसुक्क हाँस्नुभयो। &quot;तालले जहाँ लैजान चाहन्छ, त्यहीँ।&quot;</div>

<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Water ripples softly, warm smiles glow. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book13/spread-11.jpg" alt="Book 13 — Spread 11">
<figcaption><b>Spread 11.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
