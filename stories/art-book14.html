<figure class="card"><img loading="lazy" src="img/book14/spread-01.jpg" alt="Book 14 — Spread 1">
<figcaption><b>Spread 1.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Morning at Lukla. Under a long string of fluttering prayer flags, Maya, Grandmother, and Moti step onto the mountain trail. Green hills roll below them; snowy peaks peek far ahead. &quot;This road climbs all the way to the top of the world,&quot; says Grandmother. Maya squeezes her backpack straps. &quot;Then let&#x27;s go!&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">लुक्लामा बिहान। फर्फराइरहेका प्रार्थना झण्डाका लामो लहरमुनि माया, हजुरआमा, र मोती पहाडी बाटोमा पाइला राख्छन्। तल हरियो पहाडहरू बग्छन्; टाढा अगाडि हिउँका टुप्पाहरू झल्कन्छन्। &quot;यो बाटो संसारको टुप्पोसम्मै चढ्छ,&quot; हजुरआमाले भन्नुभयो। मायाले आफ्नो झोलाका फिताहरू कसिन्। &quot;त्यसो भए जाऔँ!&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Steady climbing, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-02.jpg" alt="Book 14 — Spread 2">
<figcaption><b>Spread 2.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">A long steel bridge hangs high above the Dudh Kosi river, swinging gently in the wind. Maya holds Grandmother&#x27;s hand tight as they step onto it together. Far below, the milky river rushes over white rocks. Moti trots ahead, tail up, not scared one bit. &quot;One brave step, then another,&quot; whispers Grandmother.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">एउटा लामो फलामे पुल दूधकोशी नदीमाथि अग्लोमा झुन्डिएको छ, हावामा बिस्तारै हल्लिँदै। मायाले हजुरआमाको हात कसिलो समात्छिन् र उनीहरू सँगै त्यसमा पाइला राख्छन्। धेरै तल, दुधजस्तो सेतो नदी सेता ढुङ्गाहरूमा बग्छ। मोती अगाडि दौडन्छ, पुच्छर उठाएको, अलिकति पनि नडराएको। &quot;एउटा बहादुर पाइला, अनि अर्को,&quot; हजुरआमाले सुस्तरी भन्नुभयो।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. The river flows gently, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-03.jpg" alt="Book 14 — Spread 3">
<figcaption><b>Spread 3.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Clop-clop-clop! A line of mules comes round the bend, bells jingling on their necks, carrying bright sacks of rice and salt. Maya presses against the mountain wall to let them pass. Moti stares, nose twitching, fascinated by the jingling bells. &quot;Even the mountain says hello with bells,&quot; laughs Grandmother.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">टप-टप-टप! खच्चडहरूको एउटा लहर मोडबाट आउँछ, घाँटीमा घण्टीहरू झनझनाउँदै, चामल र नुनका चम्किला बोराहरू बोकेर। माया तिनीहरूलाई बाटो दिन पहाडी पर्खालमा टाँसिन्छिन्। मोती हेर्छ, नाक फर्फराउँदै, झनझनाउने घण्टीहरूले मोहित। &quot;पहाडले पनि घण्टीले नमस्ते भन्छ,&quot; हजुरआमा हाँस्नुभयो।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Characters laugh warmly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-04.jpg" alt="Book 14 — Spread 4">
<figcaption><b>Spread 4.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">They climb into Namche Bazaar — a whole town stacked like colorful steps on the green hillside! Stone houses with painted windows, tiny shops, and prayer flags everywhere. Trekkers and Sherpa children wave from the lanes. Moti sniffs a basket of oranges. Maya spins around, trying to see it all at once.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">उनीहरू नाम्चे बजारमा चढ्छन् — हरियो डाँडामा रङ्गीन खुड्किला जस्तै थुप्रिएको पूरै सहर! रङ्गिएका झ्याल भएका ढुङ्गाका घरहरू, साना पसलहरू, अनि जताततै प्रार्थना झण्डाहरू। पदयात्रीहरू र शेर्पा नानीबाबुहरू गल्लीहरूबाट हात हल्लाउँछन्। मोतीले सुन्तलाको टोकरी सुँघ्छ। माया सबै एकैपटक देख्न खोज्दै गोल घुम्छिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Steady climbing, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-05.jpg" alt="Book 14 — Spread 5">
<figcaption><b>Spread 5.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Inside a warm stone teahouse, they rest by a glowing stove. A kind teahouse owner sets down a steaming bowl of soup for Maya. Grandmother wraps her shawl tighter and tells a story about the mountain yetis who are really just shy snow bears. Moti curls up on the wooden bench, nose on his paws, dreaming of soup.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">न्यानो ढुङ्गाको चिया घरभित्र उनीहरू बलिरहेको चुल्होछेउमा आराम गर्छन्। दयालु चिया घरकी मालिकले मायाका लागि तातो झोलको कटौरा राखिदिइन्। हजुरआमाले आफ्नो शाल कसिलो बेर्नुभयो र पहाडी येतिहरूबारे कथा सुनाउनुभयो जो साँच्चै लजालु हिउँ भालुहरू मात्र हुन्। मोती काठको बेञ्चमा बेरियो, नाक पञ्जामा, झोलको सपना देख्दै।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Moti&#x27;s tail wags gently, light snow drifts down. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-06.jpg" alt="Book 14 — Spread 6">
<figcaption><b>Spread 6.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Along the trail runs a long mani wall — stone after stone carved with holy words. &quot;Always walk to the left, clockwise,&quot; says Grandmother, leading Maya around the chortens with their painted eyes watching kindly over the valley. Moti pads after them, round and round, a good little pilgrim.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बाटोमा लामो माने पर्खाल छ — पवित्र शब्दहरू कुँदिएका ढुङ्गा-ढुङ्गा। &quot;सधैँ बायाँतर्फ, घडी घुम्ने दिशामा हिँड,&quot; हजुरआमाले भन्नुभयो, मायालाई चोर्तेनहरू वरिपरि लैजाँदै, तिनका रङ्गिएका आँखाहरूले उपत्यकामाथि दयालु भएर हेरिरहेका। मोती उनीहरूको पछिपछि पद्चाप हाल्छ, गोल-गोल, असल सानो तीर्थयात्री।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Soft zoom toward the characters. Moti&#x27;s tail wags gently, slow forward walking. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-07.jpg" alt="Book 14 — Spread 7">
<figcaption><b>Spread 7.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The path turns white. A line of shaggy yaks with big brass bells comes plodding through the snow, their breath puffing like clouds. Maya wears her warm winter jacket and woolly hat now — braids and red ribbons still peeking out. Moti wears his tiny knitted sweater, trotting bravely between the yak legs. &quot;Step where the yaks step,&quot; says Grandmother. &quot;They know the safe way.&quot;</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बाटो सेतो हुन्छ। ठूला पीतलका घण्टी भएका रौँले भरिएका याकहरूको लहर हिउँमा हिँड्दै आउँछ, तिनीहरूको सास बादल जस्तै फुस्स। मायाले अब आफ्नो न्यानो जाडोको ज्याकेट र ऊनी टोपी लगाएकी छन् — चुल्ठा र रातो रिबनहरू अझै देखिइरहेका। मोतीले आफ्नो सानो बुनिएको स्वेटर लगाएको छ, याकका खुट्टाहरूबीच बहादुरीपूर्वक दौडँदै। &quot;याकहरूले हिँडेको ठाउँमा पाइला राख,&quot; हजुरआमाले भन्नुभयो। &quot;तिनीहरूलाई सुरक्षित बाटो थाहा छ।&quot;</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Clouds drift slowly, Moti&#x27;s tail wags gently. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-08.jpg" alt="Book 14 — Spread 8">
<figcaption><b>Spread 8.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The great monastery of Tengboche rises white and gold against the blue sky. Inside, rows of butter lamps glow like little suns, and monks in red robes chant softly. A monk lights one lamp for Maya&#x27;s journey. She watches the flame dance. &quot;For brave steps,&quot; he says. Grandmother bows her head, smiling.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तेङ्बोचेको ठूलो गुम्बा नीलो आकाशमा सेतो र सुनौलो उठेको छ। भित्र, घ्यूका बत्तीहरूका लहरहरू साना सूर्यहरू जस्तै चम्कन्छन्, अनि रातो लुगा लगाएका भिक्षुहरू सुस्तरी मन्त्र जप्छन्। एउटा भिक्षुले मायाको यात्राका लागि एउटा बत्ती बालिदिए। उनले ज्वाला नाचेको हेरिन्। &quot;बहादुर पाइलाहरूका लागि,&quot; उनले भने। हजुरआमाले टाउको निहुर्‍याउनुभयो, मुसुक्क हाँस्दै।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Slow cinematic zoom in. Figures sway in a gentle dance, lamp flames flicker warmly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-09.jpg" alt="Book 14 — Spread 9">
<figcaption><b>Spread 9.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The trail is steep now, and the snow reaches Maya&#x27;s boots. She is tired — her little legs feel heavy. Grandmother kneels beside her. &quot;The mountain is big,&quot; she says softly, &quot;but so is your heart. Just one more brave step.&quot; Maya takes a deep breath — and takes it. Moti looks back at her, wagging. &quot;Again!&quot; she says.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">बाटो अहिले ठाडो छ, अनि हिउँ मायाका जुत्तासम्म पुग्छ। उनी थाकेकी छन् — उनका साना खुट्टाहरू गह्रौँ लाग्छन्। हजुरआमा उनको छेउमा घुँडा टेक्नुभयो। &quot;पहाड ठूलो छ,&quot; उहाँले सुस्तरी भन्नुभयो, &quot;तर तिम्रो मुटु पनि ठूलो छ। बस अझ एउटा बहादुर पाइला।&quot; मायाले गहिरो सास लिइन् — अनि पाइला चालिन्। मोतीले उनलाई फर्केर हेर्‍यो, पुच्छर हल्लाउँदै। &quot;फेरि!&quot; उनले भनिन्।</div>
<div class="slabel">HeyGen prompt <span class="hint">— tap text to edit</span></div>
<div class="script hg" contenteditable="true" spellcheck="false">Gentle slow push-in toward the scene. Moti&#x27;s tail wags gently, light snow drifts down. Warm light shimmers softly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>
</figcaption></figure>
<figure class="card"><img loading="lazy" src="img/book14/spread-10.jpg" alt="Book 14 — Spread 10">
<figcaption><b>Spread 10.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">They did it! Everest Base Camp — prayer flags everywhere, fluttering in the cold wind, a field of colorful tents below the mighty Khumbu Icefall. And above it all, Everest towers, huge and white, touching the sky. Maya throws her arms wide. &quot;The top of the world!&quot; she shouts, and the mountain echoes back.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
</script></body></html>
