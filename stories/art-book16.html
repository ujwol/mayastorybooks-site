<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Dashain is coming! In the courtyard, fathers lash bamboo poles with rope — the great Dashain swing, the linge ping, rises higher and higher. Maya watches, and Moti barks at the swinging ropes. &quot;This year I will swing the highest!&quot; Maya says. Art: village/Kathmandu courtyard at golden afternoon light; men raising a tall bamboo linge ping; Maya (two black braids, red ribbons, rose-pink kurta with white-silver embroidery, white shalwar, pink sandals) watching wide-eyed; Moti, small fluffy white-cream dog, barking at the ropes.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">दशैँ आउँदै छ! आँगनमा, बुवाहरूले बाँसका खम्बाहरू डोरीले बाँध्छन् — ठूलो दशैँको पिङ, लिङ्गे पिङ, झन् झन् अग्लो उठ्छ। माया हेर्छिन्, अनि मोती डोरीहरूमा भुक्छ। &quot;यस वर्ष म सबैभन्दा अग्लो उड्छु!&quot; मायाले भनिन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">Grandmother plants barley seeds in a clay pot — green jamara for Dashain blessings. Maya strings marigolds, yellow and orange, for the doorway. &quot;Grandmother,&quot; Maya asks, &quot;why is Dashain the biggest festival of all?&quot; Art: home veranda; Grandmother (grey hair in bun, no glasses, maroon dress, cream shawl) sowing barley in a clay pot; Maya threading marigold garlands; Moti sniffing flower petals.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमाले माटोको गमलामा जौका बीउ रोप्नुभयो — दशैँको आशीर्वादका लागि हरियो जमरा। मायाले ढोकाका लागि सयपत्री, पहेँलो र सुन्तला, उनिन्। &quot;हजुरआमा,&quot; मायाले सोधिन्, &quot;दशैँ सबैभन्दा ठूलो चाड किन हो?&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother tells the old story. Long ago, a buffalo-demon named Mahishasura scared everyone — in the heavens and on the earth. So all the gods poured out their light, and from that light came Durga — the goddess with many arms, riding a lion. &quot;She did not run away,&quot; Grandmother says. &quot;She stood up.&quot; Art: warm lamplit interior, evening; Grandmother storytelling with animated hands; Maya listening, chin in hands; on the wall behind them a traditional Durga thangka/poster (many-armed goddess on a lion); Moti asleep at Maya&#x27;s feet.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमाले पुरानो कथा सुनाउनुभयो। धेरै पहिले, महिषासुर नामको भैँसी-राक्षसले सबैलाई डराउँथ्यो — स्वर्गमा र पृथ्वीमा। त्यसैले सबै देवताहरूले आफ्नो ज्योति पोखे, अनि त्यो ज्योतिबाट दुर्गा प्रकट हुनुभयो — धेरै हात भएकी देवी, सिंहमा सवार। &quot;उहाँ भाग्नुभएन,&quot; हजुरआमाले भन्नुभयो। &quot;उहाँ उभिनुभयो।&quot;</div>

<div class="script hg" contenteditable="true" spellcheck="false">Slow pan across the scene. Moti&#x27;s tail wags gently, lamp flames flicker warmly. Keep the watercolor style, faces, and outfits exactly the same. Do not change or morph any character.</div>

<figcaption><b>Spread 4.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Durga fought the demon for nine days and nine nights. She was smaller than him. But her heart was bigger than her fear. &quot;Wasn&#x27;t she scared?&quot; Maya whispers. &quot;Even lions feel scared,&quot; Grandmother smiles. &quot;Being brave means doing what is right, even when your knees wobble.&quot; Art: storybook-within-storybook illustration: stylized Durga (golden, many arms holding conch/disc/trident, riding a roaring lion) facing a shadowy buffalo-demon under a stormy sky; Maya and Grandmother small in the foreground, watching the tale unfold like a vision.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">दुर्गाले राक्षससँग नौ दिन र नौ रात लड्नुभयो। उहाँ उभन्दा सानी हुनुहुन्थ्यो। तर उहाँको मुटु उहाँको डरभन्दा ठूलो थियो। &quot;उहाँ डराउनुभएन?&quot; मायाले सुस्तरी सोधिन्। &quot;सिंहहरूलाई पनि डर लाग्छ,&quot; हजुरआमा मुसुक्क हाँस्नुभयो। &quot;बहादुर हुनु भनेको घुँडा कापे पनि सही काम गर्नु हो।&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">At the swing, the big boys are laughing — but little Aarav is not laughing. They shove him away from the ropes. &quot;Too small! Go away!&quot; Aarav&#x27;s lip trembles. Maya&#x27;s tummy feels tight. She wants to say something — but the words hide. Art: the tall bamboo swing in the courtyard; two bigger boys blocking small Aarav (a shy 5-year-old in a blue vest) from the swing; Maya at the edge of the scene, worried, one hand half-raised; Moti beside her, ears back.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">पिङछेउ, ठूला केटाहरू हाँसिरहेका छन् — तर सानो आरव हाँसिरहेको छैन। उनीहरूले उसलाई डोरीबाट धकेल्छन्। &quot;धेरै सानो! जाऊ!&quot; आरवको ओठ काँप्छ। मायाको पेट कस्सिन्छ। उनी केही भन्न चाहन्छिन् — तर शब्दहरू लुक्छन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">That evening, Maya tells Grandmother everything. &quot;I wanted to help Aarav. But I was scared.&quot; Grandmother ties a fresh red ribbon into Maya&#x27;s braid. &quot;Durga&#x27;s knees wobbled too, little one. Courage is not having no fear. It is fear — standing up anyway.&quot; Art: quiet veranda at dusk, diyo lamp glowing; Grandmother re-tying the red ribbon in Maya&#x27;s braid; Maya looking down, thoughtful; Moti resting his head on her lap.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">त्यो साँझ, मायाले हजुरआमालाई सबै कुरा भनिन्। &quot;म आरवलाई सघाउन चाहन्थेँ। तर म डराएँ।&quot; हजुरआमाले मायाको चुल्ठोमा नयाँ रातो रिबन बाँधिदिनुभयो। &quot;दुर्गाका घुँडा पनि कापेका थिए, सानी। साहस भनेको डर नहुनु होइन। डर हुँदाहुँदै पनि उभिनु हो।&quot;</div>

<figcaption><b>Spread 7.</b>
<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">The next morning, Maya walks to the swing. Her heart goes thump-thump-thump. She closes her eyes and pictures the goddess — many arms, golden light, riding her lion. Step. Step. Step. She walks right up to the big boys. Art: Maya walking toward the swing with determination, morning light; faint golden shimmer around her like Durga&#x27;s light; a small lion shape in the clouds above (imagination); Moti trotting loyally at her heels.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अर्को बिहान, माया पिङतिर हिँड्छिन्। उनको मुटु धड्क-धड्क-धड्क गर्छ। उनले आँखा बन्द गर्छिन् र देवीलाई कल्पना गर्छिन् — धेरै हात, सुनौलो ज्योति, सिंहमा सवार। पाइला। पाइला। पाइला। उनी ठूला केटाहरूछेउ सिधै जान्छिन्।</div>

<div class="script en" contenteditable="true" spellcheck="false">&quot;Stop,&quot; Maya says. Her voice shakes a little — but it comes out. &quot;That is not how we play. The swing is for everyone.&quot; The big boys stare. Moti barks — yap, yap! — as if to say, &quot;Yes! What she said!&quot; Art: Maya standing tall before the two big boys, one arm slightly raised; Aarav peeking from behind her; Moti barking fiercely (tiny but mighty); the swing ropes framing the scene.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">&quot;रोक,&quot; मायाले भनिन्। उनको आवाज अलि काँप्छ — तर निस्कन्छ। &quot;यसरी खेलिँदैन। पिङ सबैका लागि हो।&quot; ठूला केटाहरू हेर्छन्। मोती भुक्छ — भुक्, भुक्! — मानौँ भन्दै छ, &quot;हो! उनले भनेको कुरा!&quot;</div>

<div class="script en" contenteditable="true" spellcheck="false">One by one, the other children step up beside Maya. &quot;The swing is for everyone,&quot; they say together. The biggest boy looks at his feet. &quot;I... I was only joking,&quot; he mumbles. &quot;Sorry, Aarav.&quot; And Aarav smiles — the biggest smile in the whole courtyard. Art: a line of village children standing with Maya facing the big boys; the biggest boy sheepish, scratching his head; Aarav&#x27;s face lighting up; warm midday light.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">एकएक गर्दै, अरू केटाकेटीहरू मायाको छेउमा उभिन्छन्। &quot;पिङ सबैका लागि हो,&quot; उनीहरू सँगै भन्छन्। सबैभन्दा ठूलो केटो आफ्ना खुट्टा हेर्छ। &quot;म... म त ठट्टा मात्र गरेको थिएँ,&quot; ऊ सुस्तरी भन्छ। &quot;माफ गर, आरव।&quot; अनि आरव मुसुक्क हाँस्छ — सम्पूर्ण आँगनकै सबैभन्दा ठूलो मुसुकान।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
