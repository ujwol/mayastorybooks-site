<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">It is a warm, golden afternoon. Maya and her friends are racing to the old mango tree — the last one there has to be the monkey! Maya runs fast, her braids flying. Moti runs faster, barking with joy. Art: sunlit village courtyard; Maya (two black braids, red ribbons, rose-pink kurta with white-silver embroidery, white shalwar, pink sandals) sprinting toward a big mango tree, laughing; Moti, small fluffy white-cream dog, racing beside her; two friends running behind; marigold pots along a low brick wall.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">न्यानो, सुनौलो दिउँसो छ। माया र उनका साथीहरू पुरानो आँपको रूखतिर दौडिरहेका छन् — अन्त्यमा पुग्ने बाँदर बन्नुपर्छ! माया छिटो दौड्छिन्, उनका चुल्ठाहरू उड्छन्। मोती झन् छिटो दौड्छ, खुसीले भुक्दै।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Then — a loose stone! Maya&#x27;s foot catches it, and down she goes — thump! — onto the dusty ground. Her knee scrapes the dirt. It stings. Tears spring to her eyes. &quot;Oww!&quot; Maya cries. &quot;My knee!&quot; Art: the moment of the fall, dust puffing up; Maya sitting on the ground clutching her scraped knee, tears welling; the loose grey stone beside her foot; Moti rushing to her, worried; friends stopping mid-run.</div>

<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">अनि — एउटा खुकुलो ढुङ्गा! मायाको खुट्टा त्यसमा अड्कियो, अनि उनी लडिन् — धडाम! — धुलो जमिनमा। उनको घुँडामा घाउ भयो। पोल्छ। आँखामा आँसु आयो। &quot;ऐया!&quot; माया चिच्याइन्। &quot;मेरो घुँडा!&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother comes quickly. She washes the scrape with cool water from the brass lota and dabs it dry. &quot;There,&quot; she says softly, tying a clean cloth around the knee. &quot;The hurt will fade soon.&quot; Maya sniffles. The knee already stings less. Art: shaded veranda; Grandmother (grey hair in bun, no glasses, maroon dress, cream shawl) kneeling, gently washing Maya&#x27;s knee with water poured from a brass lota; Maya sitting on the veranda step, tear-streaked but calmer; Moti licking her hand.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमा छिटो आउनुभयो। उहाँले पित्तलको लोटाबाट चिसो पानीले घाउ पखाल्नुभयो र पुछेर सुकाउनुभयो। &quot;लौ,&quot; उहाँले सुस्तरी भन्नुभयो, घुँडामा सफा कपडा बाँध्दै। &quot;दुखाइ चाँडै हराउँछ।&quot; माया सुँक्कसुँक्क गरिन्। घुँडा पहिले नै कम पोल्न थाल्यो।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">But as the afternoon goes on, Maya stays grumpy. She will not play. She will not smile. &quot;It is all that stupid stone&#x27;s fault!&quot; she huffs. She pushes her mango away. She even snaps at Moti when he brings her his ball. The whole afternoon feels grey — even though her knee barely hurts anymore. Art: Maya sitting alone on the courtyard steps, arms crossed, frowning at the ground; friends playing ball in the soft-focus background; Moti lying nearby with the ball, ears drooped; long afternoon shadows.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">तर दिउँसो बित्दै जाँदा, माया झोँकमा बसिरहिन्। उनी खेल्दिनन्। उनी मुसुक्क हाँस्दिनन्। &quot;यो सबै त्यो मूर्ख ढुङ्गाको दोष हो!&quot; उनले फुर्किन्। उनले आफ्नो आँप धकेलिन्। मोतीले आफ्नो बल ल्याउँदा उसलाई झर्किन् समेत। सम्पूर्ण दिउँसो खैरो लाग्यो — यद्यपि उनको घुँडा अब खासै दुख्दैनथ्यो।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother sits beside her and puts a warm arm around her shoulders. &quot;Your knee got one arrow today,&quot; she says. &quot;But this grumpiness — that is a different arrow. Let me tell you a very old story.&quot; Maya leans against her. &quot;About arrows?&quot; &quot;About two of them,&quot; Grandmother nods. Art: quiet corner of the veranda at late afternoon; Grandmother&#x27;s arm around Maya, both looking out at the courtyard; Moti curled at their feet; a gentle, listening mood.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमा छेउमा बस्नुभयो र काँधमा न्यानो हात राख्नुभयो। &quot;तिम्रो घुँडाले आज एउटा वाण पायो,&quot; उहाँले भन्नुभयो। &quot;तर यो झोँक — त्यो अर्कै वाण हो। म तिमीलाई एउटा धेरै पुरानो कथा सुनाउँछु।&quot; माया उहाँतिर ढल्किन्। &quot;वाणहरूको बारेमा?&quot; &quot;दुई वटाको बारेमा,&quot; हजुरआमाले टाउको हल्लाउनुभयो।</div>

<div class="script en" contenteditable="true" spellcheck="false">Long, long ago, the Buddha told of a traveler walking alone through a deep forest. Suddenly — twang! — an arrow struck his leg. It hurt terribly! The traveler sat down. He pulled the arrow out. He rested until the pain softened. That was the first arrow — and it was real. Art: storybook-within-storybook vision: a misty ancient forest path; a traveler in simple robes sitting beneath a tall tree, pulling a single arrow from his leg; Maya and Grandmother small in the foreground, watching the tale unfold like a dream.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">धेरै, धेरै पहिले, बुद्धले गहिरो जङ्गलबाट एक्लै हिँडिरहेको यात्रीको कथा सुनाउनुभयो। अचानक — ट्वाङ! — एउटा वाण उसको खुट्टामा लाग्यो। नराम्ररी दुख्यो! यात्री बस्यो। उसले वाण निकाल्यो। दुखाइ कम नहुञ्जेल ऊ आराम गर्यो। त्यो पहिलो वाण थियो — अनि त्यो साँचो थियो।</div>

<div class="script en" contenteditable="true" spellcheck="false">&quot;But then,&quot; the Buddha said, &quot;some people shoot themselves with a second arrow. They cry, &#x27;Why did this happen to ME?&#x27; They shake their fists at the sky. They stay angry all day long. The first arrow hurt their leg. The second arrow hurts their heart — and they shot it themselves.&quot; Maya is very quiet. Art: the vision continues — beside the resting traveler, a shadowy second figure firing arrows upward in anger while storm clouds gather over him; the calm traveler in warm light, the angry one in grey; Maya&#x27;s eyes wide in the foreground.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">&quot;तर त्यसपछि,&quot; बुद्धले भन्नुभयो, &quot;कसैले आफैँलाई दोस्रो वाण हान्छन्। उनीहरू रुन्छन्, &#x27;मलाई नै किन यस्तो भयो?&#x27; उनीहरू आकाशतिर मुठी हल्लाउँछन्। उनीहरू दिनभरि रिसाएर बस्छन्। पहिलो वाणले उनीहरूको खुट्टा दुखायो। दोस्रो वाणले उनीहरूको मुटु दुखाउँछ — अनि उनीहरूले आफैँ हानेका हुन्।&quot; माया एकदमै चुप छिन्।</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Grandmother looks at Maya gently. &quot;Your scrape was the first arrow, little one. It hurt — that was true. But this whole grumpy afternoon... who has been shooting those arrows?&quot; Maya thinks. Her knee feels almost fine now. The tears dried long ago. &quot;...Me,&quot; she whispers. &quot;I have been shooting them at myself.&quot; Art: close, tender moment on the veranda; Grandmother smiling softly, one hand on Maya&#x27;s cheek; Maya looking down at her bandaged knee, thoughtful; Moti lifting his head, hopeful.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">हजुरआमाले मायालाई कोमलतासाथ हेर्नुभयो। &quot;तिम्रो घाउ पहिलो वाण थियो, सानी। दुख्यो — त्यो साँचो थियो। तर यो सम्पूर्ण झोँके दिउँसो... ती वाणहरू कसले हानिरहेको थियो?&quot; मायाले सोचिन्। उनको घुँडा अब लगभग ठीक छ। आँसु धेरै पहिले सुकिसके। &quot;...मैले,&quot; उनले सुस्तरी भनिन्। &quot;मैले आफैँलाई हानिरहेकी थिएँ।&quot;</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>
<div class="script en" contenteditable="true" spellcheck="false">Maya closes her eyes. She pictures all her grumpy arrows — at the stone, at the game, at poor Moti — and one by one, she lays them gently on the ground. She takes a big breath in... and lets it all out. &quot;Okay,&quot; she says. &quot;No more second arrows.&quot; Art: Maya standing in the courtyard at golden light, eyes closed, breathing deeply; faint grey arrows dissolving into the breeze around her; Moti sitting up, tail starting to wag; the mango tree glowing behind them.</div>
<div class="slabel">नेपाली <span class="hint">— tap text to edit</span></div>
<div class="script ne" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">मायाले आँखा बन्द गरिन्। उनले आफ्ना सबै झोँके वाणहरू कल्पना गरिन् — ढुङ्गातिर, खेलतिर, बेचारा मोतीतिर — अनि एकएक गर्दै, उनले तिनीहरूलाई बिस्तारै जमिनमा राखिन्। उनले ठूलो सास भित्र तानिन्... अनि सबै बाहिर छोडिन्। &quot;हुन्छ,&quot; उनले भनिन्। &quot;अब दोस्रो वाण छैन।&quot;</div>

<div class="script en" contenteditable="true" spellcheck="false">&quot;Can I still play?&quot; Maya calls to her friends. &quot;Hurry, Maya!&quot; they shout. &quot;You are the monkey this time!&quot; She runs — carefully around the loose stones this time — and Moti races beside her, barking with joy. Art: joyful return to the game; Maya running and laughing with her friends around the mango tree; Moti leaping beside her; the loose stone now clearly stepped around; warm late-afternoon light.</div>

<div class="slabel">English <span class="hint">— tap text to edit</span></div>

function copyScript(cls,lang,hint,tag){const t=[...document.querySelectorAll('.script.'+cls)].map((d,i)=>(tag||'Spread')+' '+i+':\n'+d.innerText.trim()).join('\n\n');const done=()=>alert(lang+' copied — '+hint+'.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('Copy failed — please select the text manually.');}document.body.removeChild(ta);}
document.getElementById('copyEn').onclick=()=>copyScript('en','English script','paste it into the other LLM');
document.getElementById('copyNe').onclick=()=>copyScript('ne','Nepali script','paste it into the other LLM');
document.getElementById('copyHg').onclick=()=>copyScript('hg','HeyGen prompts','paste them into HeyGen one by one','HeyGen Prompt');
</script><script>
/* Roman -> Devanagari transliterator for the Nepali edit boxes.
   Type roman ("hamro") + space and it becomes Devanagari ("हाम्रो"). */
const TR_C={'ksh':'क्ष','kh':'ख','k':'क','gh':'घ','g':'ग','ng':'ङ','chh':'छ','ch':'च','jh':'झ','j':'ज','ny':'ञ','th':'थ','t':'त','dh':'ध','d':'द','n':'न','ph':'फ','p':'प','bh':'भ','b':'ब','m':'म','y':'य','r':'र','l':'ल','w':'व','v':'व','sh':'श','s':'स','h':'ह','tra':'त्र','gya':'ज्ञ','shr':'श्र'};
const TR_VI={'aa':'आ','a':'अ','ee':'ई','ii':'ई','i':'इ','oo':'ऊ','uu':'ऊ','u':'उ','ai':'ऐ','e':'ए','au':'औ','o':'ओ'};
const TR_VM={'aa':'ा','ee':'ी','ii':'ी','i':'ि','oo':'ू','uu':'ू','u':'ु','ai':'ै','e':'े','au':'ौ','o':'ो'};
function trTransliterate(word){
  word=word.toLowerCase();
  const toks=[];let i=0;
  while(i<word.length){
    let m=null;
    for(const L of [3,2,1]){const s=word.substr(i,L);if(TR_C[s]||TR_VI[s]){m=s;break;}}
    if(m){toks.push({k:TR_C[m]?'c':'v',s:m});i+=m.length;}
    else{toks.push({k:'x',s:word[i]});i++;}
  }
  let out='',pend=false;
  for(const t of toks){
    if(t.k==='x'){out+=t.s;pend=false;continue;}
    if(t.k==='c'){if(pend)out+='्';out+=TR_C[t.s];pend=true;continue;}
    if(t.s==='a'){if(!pend)out+='अ';pend=false;continue;}
    out+=pend?TR_VM[t.s]:TR_VI[t.s];pend=false;
  }
  return out;
}
function trConvert(block){
  if(block.dataset.roman!=='1')return;
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(!range.collapsed)return;
  let node=range.startContainer,offset=range.startOffset;
  if(node===block){
    if(!block.firstChild||block.firstChild.nodeType!==3)return;
    node=block.firstChild;offset=node.data.length;
  }
  if(!node||node.nodeType!==3||node.parentNode!==block)return;
  const text=node.data,before=text.slice(0,offset);
  const m=before.match(/([a-zA-Z]+)([\s.,!?;:\n\u0964\u0965)\]}>])$/);
  if(!m)return;
  const dev=trTransliterate(m[1]),start=offset-m[0].length;
  node.data=text.slice(0,start)+dev+m[2]+text.slice(offset);
  const pos=Math.min(start+dev.length+m[2].length,node.data.length);
  range.setStart(node,pos);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);
}
document.querySelectorAll('.script.ne').forEach(block=>{
  block.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n');}
  });
  block.addEventListener('input',()=>trConvert(block));
});
let romanOn=false;
const romanBtn=document.getElementById('romanToggle');
if(romanBtn)romanBtn.onclick=()=>{
  romanOn=!romanOn;
  document.querySelectorAll('.script.ne').forEach(b=>{b.dataset.roman=romanOn?'1':'';});
  romanBtn.textContent=romanOn?'A→अ: ON — type roman, space converts':'A→अ: off';
  romanBtn.style.background=romanOn?'#8a5a2b':'#fff';
  romanBtn.style.color=romanOn?'#fff':'#8a5a2b';
};
